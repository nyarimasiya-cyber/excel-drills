<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Hands-on Excel practice for analyst roles: dynamic arrays, lookups, LAMBDA, Power Query, DAX and VBA.">
<title>Excel Analyst Drills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a practice workbench. Topic list on the left; on the right one exercise: task, the tool for that topic (formula bar + live sheet, query editor, measure editor, macro editor), feedback, then hints and solution. */
:root{
  --bg:#f3f6f3; --surface:#ffffff; --ink:#17231c; --muted:#5b6a60; --line:#d3dcd5; --grid:#eaf0eb;
  --accent:#1d6b45; --accent-ink:#ffffff; --hl:#e6f1ea; --input:#fff4b8; --input-ink:#5c4a00; --spill:#f2f8f4;
  --good:#1b7646; --good-bg:#e1f2e7; --bad:#b0352a; --bad-bg:#fae6e2; --tip:#1f2a24; --tip-ink:#eef4f0;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1511; --surface:#171f1a; --ink:#e3ebe5; --muted:#98a79d; --line:#2b3730; --grid:#1f2923;
  --accent:#55c28a; --accent-ink:#0a1a11; --hl:#1c2a22; --input:#3d3512; --input-ink:#f3dc7a; --spill:#18241d;
  --good:#62cd93; --good-bg:#15301f; --bad:#f08a7c; --bad-bg:#3a1e1a; --tip:#e3ebe5; --tip-ink:#111813; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1511; --surface:#171f1a; --ink:#e3ebe5; --muted:#98a79d; --line:#2b3730; --grid:#1f2923;
  --accent:#55c28a; --accent-ink:#0a1a11; --hl:#1c2a22; --input:#3d3512; --input-ink:#f3dc7a; --spill:#18241d;
  --good:#62cd93; --good-bg:#15301f; --bad:#f08a7c; --bad-bg:#3a1e1a; --tip:#e3ebe5; --tip-ink:#111813; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.7rem,4.5vw,2.3rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.4rem;font-weight:600}
h3{font-size:.75rem;font-family:var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
code{font-family:var(--mono);font-size:.88em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lede{color:var(--muted);max-width:70ch;margin:6px 0 0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.prog{font-size:.85rem;color:var(--muted);min-width:180px}
.meter{height:6px;background:var(--grid);border-radius:3px;overflow:hidden;margin-top:6px}
.meter span{display:block;height:100%;background:var(--accent);transition:width .3s}

.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
nav.list{display:flex;flex-direction:column;gap:6px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto;padding-right:4px}
.picker{display:none}
@media (max-width:860px){.layout{grid-template-columns:1fr} nav.list{display:none} .picker{display:block}}
.picker select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
details.grp summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:5px}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary:hover{background:var(--hl)}
details.grp summary .cnt{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
details.grp summary .cnt.full{color:var(--good);font-weight:600}
.items{display:flex;flex-direction:column;gap:1px;padding:2px 0 8px}
.item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:5px 8px;border-radius:5px;font-size:.9rem}
.item:hover{background:var(--hl)}
.item[aria-current="true"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:600}
.item .no{font-family:var(--mono);font-size:.72rem;color:var(--muted);width:22px;flex:none;text-align:right}
.item .tick{margin-left:auto;color:var(--good);font-weight:700}

.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.task{font-size:1.08rem;margin:0;max-width:66ch}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600;font-family:var(--mono);font-size:.82rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .lbl{font-size:.8rem;color:var(--muted);margin-right:2px}
.chip{font-family:var(--mono);font-size:.78rem;padding:3px 8px;border:1px solid var(--line);border-radius:4px;background:var(--grid);color:var(--ink)}
button.chip:hover{border-color:var(--accent);background:var(--hl)}

.fbars{display:flex;flex-direction:column;gap:8px}
.fwrap{position:relative}
.fbar{display:flex;border:1px solid var(--line);border-radius:6px;background:var(--surface);align-items:stretch}
.fbar.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fbar .name{font-family:var(--mono);font-size:.8rem;font-weight:600;padding:0 12px;display:flex;align-items:center;background:var(--input);color:var(--input-ink);border-right:1px solid var(--line);min-width:54px;justify-content:center;border-radius:5px 0 0 5px;white-space:nowrap}
.fbar .fx{font-family:var(--mono);font-style:italic;color:var(--muted);padding:0 10px;display:flex;align-items:center;border-right:1px solid var(--line);font-size:.85rem}
.fbar input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-family:var(--mono);font-size:.92rem;padding:11px 12px}
.fbar input:focus{outline:none}
.fbar input.short{flex:0 0 150px;border-right:1px solid var(--line)}

/* autocomplete + argument tip */
.isense{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.14);overflow:hidden;max-width:560px}
.opt-row{display:flex;gap:10px;align-items:baseline;padding:6px 10px;cursor:pointer;font-size:.85rem}
.opt-row.on{background:var(--hl)}
.opt-row .ty{font-family:var(--mono);font-size:.68rem;color:var(--accent);width:24px;flex:none;font-weight:600}
.opt-row .nm{font-family:var(--mono);font-weight:600;white-space:nowrap}
.opt-row .ds{color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.isense-foot{font-size:.7rem;color:var(--muted);padding:4px 10px;border-top:1px solid var(--line);background:var(--grid)}
.argtip{position:absolute;left:0;top:100%;margin-top:4px;z-index:25;background:var(--tip);color:var(--tip-ink);border-radius:6px;padding:7px 11px;font-size:.8rem;display:flex;flex-direction:column;gap:2px;max-width:min(560px,100%);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.argtip code{font-size:.8rem;white-space:normal;word-break:break-word}
.argtip b{text-decoration:underline;text-underline-offset:3px}
.argtip span{opacity:.85}
.isense:not([hidden]) + .argtip{display:none}

.runrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:8px 16px;border-radius:6px;font-weight:600;font-size:.92rem}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{border-color:var(--line);background:transparent;color:var(--muted);font-weight:500}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kbd{font-size:.8rem;color:var(--muted)}
.status{border-radius:6px;padding:10px 14px;font-size:.95rem;display:flex;gap:10px;align-items:flex-start}
.status .ic{font-weight:700;font-family:var(--mono)}
.status.ok{background:var(--good-bg);color:var(--good)}
.status.no{background:var(--bad-bg);color:var(--ink)} .status.no .ic{color:var(--bad)}
.status.info{background:var(--grid);color:var(--muted)}
.status p{margin:0}

.gridwrap{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.gridwrap.tall{max-height:420px}
table.xl{border-collapse:collapse;font-size:.84rem;font-variant-numeric:tabular-nums;width:max-content;min-width:100%}
table.xl th,table.xl td{border:1px solid var(--line);padding:3px 10px;text-align:left;white-space:nowrap;height:26px;min-width:84px}
table.xl thead th{background:var(--grid);color:var(--muted);font-weight:500;font-family:var(--mono);font-size:.72rem;text-align:center;min-width:0;position:sticky;top:0;z-index:1}
table.xl tbody th{background:var(--grid);color:var(--muted);font-weight:500;font-family:var(--mono);font-size:.72rem;text-align:center;min-width:34px;width:34px;padding:3px 4px}
table.xl td.lab{font-weight:600;color:var(--accent);font-size:.8rem}
table.xl td.num{text-align:right}
table.xl td.in{background:var(--input);color:var(--input-ink);cursor:pointer}
table.xl td.in.empty::after{content:"type here";font-size:.72rem;opacity:.7;font-style:italic}
table.xl td.sp{background:var(--spill)}
table.xl td.err{color:var(--bad);font-weight:600}
table.xl td.diff{box-shadow:inset 0 0 0 2px var(--bad)}
table.xl td.new{background:var(--spill)}
table.xl td.e-t{border-top:1.5px dashed var(--accent)} table.xl td.e-b{border-bottom:1.5px dashed var(--accent)}
table.xl td.e-l{border-left:1.5px dashed var(--accent)} table.xl td.e-r{border-right:1.5px dashed var(--accent)}
table.xl tr.tot td{font-weight:600;border-top:2px solid var(--ink)}
table.pq th.h{background:var(--grid);color:var(--ink);font-family:var(--body);font-size:.8rem;font-weight:600;text-align:left;padding:4px 10px}
table.pq th.h .ty{font-family:var(--mono);font-size:.66rem;color:var(--muted);margin-right:6px;font-weight:500}
table.pq td.null{color:var(--muted);font-style:italic}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:12px;border:1px solid var(--line);display:inline-block}

/* name manager */
.nm-box{border:1px dashed var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.nm-box .fbar .name{background:var(--grid);color:var(--muted)}

/* power query */
.pqgrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:700px){.pqgrid{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps li{display:flex;align-items:center;gap:6px;border-radius:4px}
.steps li button.pick{flex:1;text-align:left;background:none;border:0;padding:5px 8px;border-radius:4px;font-size:.88rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps li.on button.pick{background:var(--surface);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.steps li.bad button.pick{color:var(--bad)}
.steps li .x{background:none;border:0;color:var(--muted);padding:2px 6px;font-size:.9rem}
.steps li .x:hover{color:var(--bad)}
.form{display:flex;flex-direction:column;gap:8px}
.form label{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.form select,.form input[type=text],.form input[type=number]{font:inherit;font-size:.88rem;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);width:100%}
.form .checks{display:flex;flex-direction:column;gap:2px;max-height:150px;overflow-y:auto;border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:var(--surface)}
.form .checks label,.form label.inline{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:.86rem}
.mcode{margin:0;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:.78rem;overflow-x:auto;white-space:pre;max-height:260px}
details.adv summary{cursor:pointer;font-size:.88rem;color:var(--accent);font-weight:600}
.err-note{color:var(--bad);font-size:.85rem;margin:0}

/* dax + vba */
.measures{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.vba{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px 0;font-family:var(--mono);font-size:.86rem;overflow-x:auto}
.vba .ln{display:flex;align-items:center;min-height:26px;white-space:pre;padding-right:12px}
.vba .ln .no{width:36px;text-align:right;padding-right:12px;color:var(--muted);font-size:.72rem;flex:none}
.vba .kw{color:var(--accent);font-weight:600}
.vba .cm{color:var(--muted);font-style:italic}
.vba input{font-family:var(--mono);font-size:.86rem;border:1px solid var(--line);border-radius:4px;padding:4px 8px;background:var(--input);color:var(--input-ink);min-width:min(420px,60vw);flex:1}
.vba input:focus{outline:2px solid var(--accent)}

.actions{display:flex;flex-wrap:wrap;gap:8px}
.reveal{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.hint{display:flex;gap:10px;margin:0;max-width:65ch}
.hint .n{font-family:var(--mono);font-size:.75rem;color:var(--muted);padding-top:3px;flex:none}
.code{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg);align-items:stretch}
.code .tag{font-family:var(--mono);font-size:.75rem;padding:10px;border-right:1px solid var(--line);min-width:52px;text-align:center;font-weight:600;background:var(--input);color:var(--input-ink);white-space:nowrap}
.code pre{margin:0;padding:10px 12px;overflow-x:auto;font-family:var(--mono);font-size:.84rem;flex:1;min-width:0;white-space:pre}
.code .use{border:0;border-left:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:.8rem;color:var(--accent);font-weight:600}
.note{margin:0;max-width:65ch}
.note b{font-weight:600}
.warn{border-left:3px solid var(--bad);padding:4px 0 4px 12px;margin:0;max-width:65ch}
.small{font-size:.85rem;color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:14px}
details.data summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.data summary::-webkit-details-marker{display:none}
details.data summary::after{content:"Show";font-size:.85rem;color:var(--accent);font-weight:600}
details.data[open] summary::after{content:"Hide"}
details.data .tables{display:flex;flex-direction:column;gap:16px;margin-top:14px}

.fcell{flex:1;min-width:0;display:flex}
.fcell textarea{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-family:var(--mono);font-size:.92rem;padding:10px 12px;resize:none;overflow:hidden;line-height:1.5;white-space:pre-wrap;word-break:break-word;min-height:42px}
.fcell textarea:focus{outline:none}
.fcell textarea.ghost{display:none}
.fview{flex:1;min-width:0;font-family:var(--mono);font-size:.92rem;padding:10px 12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;cursor:text;min-height:42px}
.fview .part{border-radius:3px;transition:background .08s}
.fview .part.hov{background:var(--hl);box-shadow:0 0 0 1px var(--accent)}
.fview .part.hov .part.hov{background:transparent;box-shadow:none}
.fview .fname{font-weight:600;color:var(--ink)}
.fview .nm{font-style:italic;color:var(--accent)}
.hovertip{position:fixed;z-index:60;background:var(--tip);color:var(--tip-ink);border-radius:6px;padding:8px 12px;font-size:.8rem;display:flex;flex-direction:column;gap:3px;max-width:min(440px,92vw);box-shadow:0 8px 24px rgba(0,0,0,.2);pointer-events:none}
.hovertip code{font-size:.76rem;opacity:.75;white-space:normal;word-break:break-word}
.hovertip b{font-family:var(--mono);font-size:.86rem}
.hovertip b.bad{color:#ff9d8f}
.hovertip span{opacity:.9;line-height:1.4}
[hidden]{display:none!important}
table.pq td.tblc{color:var(--accent);font-weight:600;font-style:italic;cursor:help}

.exhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.item.noteit .no{font-weight:700;color:var(--accent)}
.item.noteit span:last-child{color:var(--accent);font-weight:500}
.ntoc{display:flex;flex-wrap:wrap;gap:6px}
.ntoc a{font-size:.82rem;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg)}
.ntoc a:hover{border-color:var(--accent)}
.nsec{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px;scroll-margin-top:16px}
.nh{font-family:var(--display);font-size:1.12rem;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:600}
.np{margin:0;max-width:68ch}
.np code,.nlist code,.ntbl td code,.ntip code,.nwarn code{background:var(--grid);border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:.84em}
.ncode{margin:0;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:4px;font-family:var(--mono);font-size:.82rem;overflow-x:auto;white-space:pre;line-height:1.6}
.nlist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;max-width:68ch}
.ntblw{overflow-x:auto}
.ntbl{border-collapse:collapse;font-size:.9rem;width:100%}
.ntbl th,.ntbl td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.ntbl th{width:38%;font-weight:500;white-space:nowrap}
.ntbl th code{font-size:.82rem;color:var(--accent)}
.ntip{margin:0;background:var(--good-bg);border-radius:6px;padding:8px 12px;max-width:68ch}
.nwarn{margin:0;background:var(--bad-bg);border-radius:6px;padding:8px 12px;max-width:68ch}
.npract{display:flex;flex-direction:column;gap:4px}
.nex{display:flex;gap:10px;align-items:center;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:.92rem}
.nex:hover{border-color:var(--accent);background:var(--hl)}
.nex .no{font-family:var(--mono);font-size:.74rem;color:var(--muted);width:22px;text-align:right}
.nex .tick{margin-left:auto;color:var(--good);font-weight:700}
@media (max-width:560px){.ntbl th{white-space:normal;width:45%}}

.tblnote{font-size:.88rem;background:var(--hl);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 6px 6px 0;max-width:72ch}
.tblnote code{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:.82rem}

.ribbon{background:var(--grid);border:1px solid var(--line);border-radius:6px 6px 0 0;margin-bottom:-14px}
.rtabs{display:flex;align-items:flex-end;gap:2px;padding:4px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.rtab{background:none;border:0;padding:6px 12px;font-size:.82rem;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.rtab.on{color:var(--accent);font-weight:600;border-bottom-color:var(--accent);background:var(--surface);border-radius:4px 4px 0 0}
.rname{margin-left:auto;font-family:var(--mono);font-size:.76rem;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:3px 10px;margin-bottom:4px;min-width:80px;text-align:center;white-space:nowrap}

<script>
// ===== Mini Excel engine: dynamic arrays, structured refs, LET =====
const XL = (() => {

const DAX = (() => {

function visible(tk, filters){

const isBlank=v=>v===null||v===undefined;
const num=v=>{ if (isBlank(v)) return 0; if (typeof v==="boolean") return v?1:0; if (typeof v==="number") return v; const n=+v; if (isNaN(n)) throw DE(`Can't convert the text "${v}" to a number.`); return n; };
function cmpv(a,b){ if (isBlank(a)) a=typeof b==="string"?"":0; if (isBlank(b)) b=typeof a==="string"?"":0;
  if (typeof a==="string"||typeof b==="string") return String(a).localeCompare(String(b),"en",{sensitivity:"base"}); return num(a)-num(b); }
function colsIn(n, acc=[]){ if (!n||typeof n!=="object") return acc; if (n.k==="col") acc.push(n); for (const k of ["l","r","e"]) colsIn(n[k],acc); (n.args||[]).forEach(a=>colsIn(a,acc)); return acc; }
function measures(){ return MODEL.measures; }

function tableVal(n, ctx){
  if (n.k==="table"){ const k=tkey(n.v); return {t:k, rows:visible(k,ctx.filters)}; }
  if (n.k==="call"){
    if (n.f==="ALL"||n.f==="REMOVEFILTERS"){ const a=n.args[0]; if (!a||a.k!=="table") throw DE(`In these drills, use ${n.f} with a whole table, e.g. ${n.f}(Shipments), or as a CALCULATE filter.`); const k=tkey(a.v); return {t:k, rows:MODEL.tables[k].rows.map((_,i)=>i)}; }
    if (n.f==="FILTER"){ const src=tableVal(n.args[0],ctx); if (!n.args[1]) throw DE("FILTER needs a table and a condition.");
      return {t:src.t, rows:src.rows.filter(i=>truth(evalS(n.args[1],{...ctx,row:{t:src.t,i}})))}; }
  }
  throw DE("A table is needed here, such as Shipments or FILTER(Shipments, …).");
}
const truth=v=>!!(typeof v==="number"?v!==0:v);
function evalMeasure(name, ctx){
  const m=measures().find(x=>x.name.toLowerCase()===name.toLowerCase());
  if (!m) throw DE(`There's no measure called [${name}]. Existing: ${measures().map(x=>`[${x.name}]`).join(", ")||"none"}. If you meant a column, write Table[Column].`);
  if (ctx.stack && ctx.stack.includes(m.name)) throw DE(`[${m.name}] refers to itself.`);
  let filters=ctx.filters; if (ctx.row) filters=[...filters.filter(f=>f.t!==ctx.row.t), {t:ctx.row.t, col:null, rows:new Set([ctx.row.i])}];
  return evalS(m.ast, {filters, row:null, stack:[...(ctx.stack||[]), m.name]});
}
function agg(n, ctx, f){
  const a=n.args[0]; if (!a||a.k!=="col") throw DE(`${n.f} needs a column, e.g. ${n.f}(Shipments[Revenue (R)]).`);
  const c=colRef(a.table,a.col); const vs=visible(c.t,ctx.filters).map(i=>MODEL.tables[c.t].rows[i][c.i]);
  return f(vs);
}
function iter(n, ctx, f){ const tv=tableVal(n.args[0],ctx); if (!n.args[1]) throw DE(`${n.f} needs a table and an expression.`);
  const vs=tv.rows.map(i=>evalS(n.args[1],{...ctx,row:{t:tv.t,i}})).filter(v=>!isBlank(v)).map(num); return f(vs); }

function evalS(n, ctx){
  switch (n.k){
    case "lit": return n.v;
    case "neg": { const v=evalS(n.e,ctx); return isBlank(v)?null:-num(v); }
    case "meas": return evalMeasure(n.v, ctx);
    case "col": { const c=colRef(n.table,n.col);
      if (!ctx.row) throw DE(`A column like ${MODEL.tables[c.t].name}[${MODEL.tables[c.t].cols[c.i]}] can't be used on its own in a measure. Wrap it in SUM( ), or use it inside an iterator like SUMX.`);
      if (ctx.row.t===c.t) return MODEL.tables[c.t].rows[ctx.row.i][c.i];
      throw DE(`You're on a ${MODEL.tables[ctx.row.t].name} row, but ${MODEL.tables[c.t].name}[${MODEL.tables[c.t].cols[c.i]}] lives in another table. Use RELATED( ).`); }
    case "table": throw DE(`'${n.v}' is a table. A measure must return one value: try COUNTROWS(${n.v}).`);
    case "bin": {
      if (n.o==="&&") return truth(evalS(n.l,ctx)) && truth(evalS(n.r,ctx));
      if (n.o==="||") return truth(evalS(n.l,ctx)) || truth(evalS(n.r,ctx));
      const a=evalS(n.l,ctx), b=evalS(n.r,ctx);
      if (n.o==="&") return `${a??""}${b??""}`;
      if (["=","<>","<",">","<=",">="].includes(n.o)){ const c=cmpv(a,b); return {"=":c===0,"<>":c!==0,"<":c<0,">":c>0,"<=":c<=0,">=":c>=0}[n.o]; }
      if (isBlank(a)&&isBlank(b)) return null;
      const x=num(a), y=num(b);
      if (n.o==="/"){ if (y===0) throw DE("Division by zero. Use DIVIDE(a, b) to return blank instead of an error."); return x/y; }
      return {"+":x+y,"-":x-y,"*":x*y,"^":Math.pow(x,y)}[n.o]; }
    case "call": return call(n, ctx);
  }
}
function call(n, ctx){
  const A=n.args;
  switch (n.f){
    case "SUM": return agg(n,ctx,vs=>{ const ns=vs.filter(v=>typeof v==="number"); return ns.length?ns.reduce((a,b)=>a+b,0):null; });
    case "AVERAGE": return agg(n,ctx,vs=>{ const ns=vs.filter(v=>typeof v==="number"); return ns.length?ns.reduce((a,b)=>a+b,0)/ns.length:null; });
    case "MIN": if (A.length===2) return Math.min(num(evalS(A[0],ctx)),num(evalS(A[1],ctx))); return agg(n,ctx,vs=>{ const ns=vs.filter(v=>typeof v==="number"); return ns.length?Math.min(...ns):null; });
    case "MAX": if (A.length===2) return Math.max(num(evalS(A[0],ctx)),num(evalS(A[1],ctx))); return agg(n,ctx,vs=>{ const ns=vs.filter(v=>typeof v==="number"); return ns.length?Math.max(...ns):null; });
    case "COUNT": return agg(n,ctx,vs=>{ const c=vs.filter(v=>typeof v==="number").length; return c||null; });
    case "DISTINCTCOUNT": return agg(n,ctx,vs=>{ const s=new Set(vs.map(v=>typeof v==="string"?v.toLowerCase():v)); return s.size||null; });
    case "COUNTROWS": { if (!A[0]) throw DE("COUNTROWS needs a table, e.g. COUNTROWS(Shipments)."); const r=tableVal(A[0],ctx).rows.length; return r||null; }
    case "SUMX": return iter(n,ctx,vs=>vs.length?vs.reduce((a,b)=>a+b,0):null);
    case "AVERAGEX": return iter(n,ctx,vs=>vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:null);
    case "MAXX": return iter(n,ctx,vs=>vs.length?Math.max(...vs):null);
    case "MINX": return iter(n,ctx,vs=>vs.length?Math.min(...vs):null);
    case "DIVIDE": { const a=evalS(A[0],ctx), b=evalS(A[1],ctx); if (isBlank(b)||num(b)===0) return A[2]?evalS(A[2],ctx):null; if (isBlank(a)) return null; return num(a)/num(b); }
    case "IF": { const c=truth(evalS(A[0],ctx)); return c?evalS(A[1],ctx):(A[2]?evalS(A[2],ctx):null); }
    case "BLANK": return null;
    case "ROUND": { const v=evalS(A[0],ctx); if (isBlank(v)) return null; const f=Math.pow(10,num(evalS(A[1],ctx))); return Math.round(num(v)*f)/f; }
    case "RELATED": { const a=A[0]; if (!a||a.k!=="col") throw DE("RELATED needs a column from the related table, e.g. RELATED(Clients[Tier])."); const c=colRef(a.table,a.col);
      if (!ctx.row) throw DE("RELATED only works on a row, inside an iterator like SUMX or FILTER."); if (ctx.row.t===c.t) return MODEL.tables[c.t].rows[ctx.row.i][c.i];
      if (ctx.row.t!=="shipments"||c.t!=="clients") throw DE("RELATED follows a relationship from the many side (Shipments) to the one side (Clients).");
      const ci=MODEL.related[ctx.row.i]; return ci<0?null:MODEL.tables.clients.rows[ci][c.i]; }
    case "CALCULATE": {
      if (!A[0]) throw DE("CALCULATE needs an expression first.");
      let filters=ctx.filters.slice(); if (ctx.row) filters=[...filters.filter(f=>f.t!==ctx.row.t),{t:ctx.row.t,col:null,rows:new Set([ctx.row.i])}];
      const adds=[];
      for (const a of A.slice(1)){
        if (a.k==="call"&&(a.f==="ALL"||a.f==="REMOVEFILTERS")){ const x=a.args[0];
          if (!x) { filters=[]; continue; }
          if (x.k==="table"){ const k=tkey(x.v); filters=filters.filter(f=> k==="shipments" ? false : f.t!==k); continue; }
          if (x.k==="col"){ const c=colRef(x.table,x.col); filters=filters.filter(f=>!(f.t===c.t&&f.col===c.i)); continue; }
          throw DE(`${a.f} needs a table or a column.`); }
        if (a.k==="call"&&a.f==="FILTER"||a.k==="table"){ const tv=tableVal(a,{...ctx,row:null,filters:ctx.filters}); adds.push({t:tv.t,col:null,rows:new Set(tv.rows)}); continue; }
        const cs=colsIn(a); const uniq=[...new Set(cs.map(c=>{ const r=colRef(c.table,c.col); return r.t+":"+r.i; }))];
        if (uniq.length!==1) throw DE("Each CALCULATE filter should test one column, like Shipments[Service] = \"Express\". For more complex tests use FILTER( ).");
        const c=colRef(cs[0].table,cs[0].col); const T=MODEL.tables[c.t];
        const rows=new Set(T.rows.map((_,i)=>i).filter(i=>truth(evalS(a,{filters:[],row:{t:c.t,i}}))));
        filters=filters.filter(f=>!(f.t===c.t&&f.col===c.i)); adds.push({t:c.t,col:c.i,rows});
      }
      return evalS(A[0],{filters:[...filters,...adds],row:null,stack:ctx.stack});
    }
    case "ALL": case "REMOVEFILTERS": case "FILTER": throw DE(`${n.f} returns a table. Use it inside CALCULATE, COUNTROWS or an iterator like SUMX.`);
    case "SUMIFS": case "VLOOKUP": case "XLOOKUP": case "SUMIF": throw DE(`${n.f} is an Excel function, not DAX. In DAX, use CALCULATE with a filter.`);
  }
  throw DE(`${n.f} isn't a DAX function these drills know.`);
}

// pivot: rows field col {table,col}; returns [{label, value, err}] incl Total
function pivot(rowField, measureName){
  const c=colRef(rowField.table,rowField.col), T=MODEL.tables[c.t];
  const vals=[...new Map(T.rows.map(r=>[String(r[c.i]).toLowerCase(), r[c.i]])).values()].sort((a,b)=>cmpv(a,b));
  const out=vals.map(v=>({label:v, ctx:{filters:[{t:c.t,col:c.i,rows:new Set(T.rows.map((r,i)=>i).filter(i=>cmpv(T.rows[i][c.i],v)===0))}],row:null}}));
  out.push({label:"Total", total:true, ctx:{filters:[],row:null}});
  for (const o of out){ try { o.value=evalMeasure(measureName,o.ctx); } catch(e){ if (e.dax) o.err=e.message; else throw e; } delete o.ctx; }
  return out;
}
function define(list){ // [{name, expr}] -> errors
  MODEL.measures=[]; for (const m of list){ try { MODEL.measures.push({name:m.name.trim(), ast:parse(m.expr.trim().replace(/^=/,"")), expr:m.expr}); } catch(e){ if (e.parse) return {name:m.name, err:e.message}; throw e; } }
  return null;
}
return { setModel, define, pivot, parse };
})();

function attachIntelli(input, opts){
  // opts: {sigs, tables:()=>({Name:[cols]}), names:()=>[names], measures:()=>[names], dax:bool, onPick}
  const host=input.closest(".fbar")||input.parentElement;
  let box=document.createElement("div"); box.className="isense"; box.hidden=true; box.setAttribute("role","listbox");
  let tip=document.createElement("div"); tip.className="argtip"; tip.hidden=true;
  host.after(tip); host.after(box);
  let items=[], sel=0, ctx=null;
  const sigs=opts.sigs;

  function tokenBefore(){
    const v=input.value, pos=input.selectionStart??v.length, left=v.slice(0,pos);
    if (inString(left)) return null;
    let m=left.match(/(?:'([^']+)'|([A-Za-z_][\w.]*))\[([^\]\[]*)$/);   // Table[col
    if (m) return {kind:"col", table:m[1]||m[2], frag:m[3], start:pos-m[3].length};
    m=left.match(/\[(@?)(\[?)([^\]\[]*)$/);                              // [@[col  or [col (inside table / DAX measure)
    if (m && opts.bareBracket) return {kind:opts.dax?"meas":"col", table:null, frag:m[3], start:pos-m[3].length, inner:!!m[2], at:!!m[1]};
    m=left.match(/(^|[^\w.\]\["'])([A-Za-z_][\w.]*)$/);
    if (m && !/^\d/.test(m[2])) return {kind:"word", frag:m[2], start:pos-m[2].length};
    return null;
  }
  function inString(s){ let n=0; for (const c of s) if (c==='"') n++; return n%2===1; }
  function currentCall(){
    const v=input.value, pos=input.selectionStart??v.length, left=v.slice(0,pos);
    let depth=0, args=0, q=false, br=0;
    for (let i=left.length-1;i>=0;i--){ const c=left[i];
      if (c==='"'){ q=!q; continue; } if (q) continue;
      if (c==="]") br++; else if (c==="[") br--; if (br>0) continue;
      if (c===")") depth++;
      else if (c==="("){ if (depth===0){ const m=left.slice(0,i).match(/([A-Za-z_][\w.]*)$/); return m?{f:m[1].toUpperCase(),arg:args}:null; } depth--; }
      else if ((c===","||c===";")&&depth===0) args++;
    }
    return null;
  }
  function suggestions(t){
    const f=t.frag.toLowerCase(); const out=[];
    if (t.kind==="word"){
      for (const k of Object.keys(sigs)) if (k.toLowerCase().startsWith(f)) out.push({label:k, insert:k+"(", type:"fx", desc:sigs[k][1]});
      for (const [tn,cols] of Object.entries(opts.tables())) if (tn.toLowerCase().startsWith(f)) out.push({label:tn, insert:opts.dax?tn:tn, type:"table", desc:`Table · ${cols.length} columns`});
      for (const n of (opts.names?opts.names():[])) if (n && n.toLowerCase().startsWith(f)) out.push({label:n, insert:n, type:"name", desc:"Name from Name Manager"});
      if (!f) return [];
    } else if (t.kind==="col"){
      const tbls=opts.tables(); const key=t.table?Object.keys(tbls).find(k=>k.toLowerCase()===t.table.toLowerCase()):(opts.rowTable||null);
      const cols=key?tbls[key]:[];
      for (const c of cols) if (c.toLowerCase().includes(f.replace(/^@/,""))){ const needs=/[^\w]/.test(c); out.push({label:c, insert:(t.table||!opts.rowTable) ? c+"]" : t.inner ? c+"]]" : (needs&&t.at ? `[${c}]]` : c+"]"), type:"col", desc:`Column of ${key}`}); }
      if (t.table && !f && !opts.dax) ["#All","#Data","#Headers"].forEach(s=>out.push({label:s, insert:s+"]", type:"col", desc:"Special item"}));
    } else if (t.kind==="meas"){
      for (const m of (opts.measures?opts.measures():[])) if (m.toLowerCase().includes(f)) out.push({label:m, insert:m+"]", type:"meas", desc:"Measure"});
    }
    return out.slice(0,9);
  }
  function render(){
    if (!items.length){ box.hidden=true; return; }
    box.innerHTML=items.map((it,i)=>`<div class="opt-row ${i===sel?"on":""}" role="option" aria-selected="${i===sel}" data-i="${i}"><span class="ty ty-${it.type}">${{fx:"fx",table:"T",col:"[ ]",name:"N",meas:"M"}[it.type]}</span><span class="nm">${esc(it.label)}</span><span class="ds">${esc(it.desc||"")}</span></div>`).join("")+`<div class="isense-foot">Tab to insert · ↑↓ to move · Esc to close</div>`;
    box.hidden=false;
    box.querySelectorAll(".opt-row").forEach(r=>{ r.onmousedown=e=>{ e.preventDefault(); sel=+r.dataset.i; accept(); }; });
  }
  function renderTip(){
    const c=currentCall(); const s=c&&sigs[c.f];
    if (!s){ tip.hidden=true; return; }
    const [args,desc]=s; let idx=c.arg;
    if (args.includes("…") && idx>=args.length-1){ const rep=args.length-2; idx = c.f==="LET"&&false ? idx : Math.min(idx, rep); }
    if (c.f==="SUMIFS"||c.f==="COUNTIFS"||c.f==="AVERAGEIFS"||c.f==="MAXIFS"||c.f==="MINIFS"){ const off=c.f==="COUNTIFS"?0:1; if (c.arg>=off+2){ idx=off+2; } }
    if (c.f==="LET"){ idx = c.arg<2?c.arg:(c.arg%2===0?2:2); }
    const parts=args.map((a,i)=>i===idx?`<b>${esc(a)}</b>`:esc(a));
    const extra = argHelp(c.f, c.arg);
    tip.innerHTML=`<code>${c.f}(${parts.join(", ")})</code><span>${esc(extra||desc)}</span>`;
    tip.hidden=false;
  }
  function argHelp(f,i){
    const H={ FILTER:["The rows or columns to return.","A TRUE/FALSE test the same height as array, e.g. Shipments[Branch]=\"Durban\".","What to show if nothing matches, e.g. \"None found\"."],
      SORT:["The array to sort.","Which column to sort by (1 = first).","1 = A to Z / smallest first, -1 = Z to A / largest first."],
      SORTBY:["The array to sort.","The column to sort by (can be outside the array).","1 ascending, -1 descending."],
      XLOOKUP:["What to find (can be a whole list, like H5#).","Where to look for it.","What to return from the matching row.","Shown when there's no match.","0 = exact (default).","1 = top to bottom, -1 = bottom to top."],
      SUMIFS:["The numbers to add.","The column to test.","The test, e.g. \"Cape Town\" or \">=\"&DATE(2026,1,1)."],
      COUNTIFS:["The column to test.","The test, e.g. \"Express\" or \">=300\"."],
      TAKE:["The array.","How many rows to keep (negative = from the end)."],
      SEQUENCE:["How many rows.","How many columns (default 1).","First number (default 1).","Step (default 1)."],
      EOMONTH:["A date.","Months to move: 0 = end of this month."],
      TEXT:["The number or date.","A format code in quotes, e.g. \"mmm yyyy\", \"#,##0\", \"0.0%\"."],
      CALCULATE:["What to calculate, e.g. [Total Revenue].","A filter, e.g. Shipments[Service] = \"Express\" or ALL(Shipments)."],
      DIVIDE:["The top number.","The bottom number.","Returned instead of an error when dividing by 0 (default blank)."],
      SUMX:["The table to loop over, e.g. Shipments.","The calculation for each row."],
      MAP:["The list to loop over, e.g. H5#.","LAMBDA(item, calculation)."], LET:["A short name, e.g. total.","The value for that name.","Next name, or the final calculation."] };
    const a=H[f]; if (!a) return null;
    if (f==="SUMIFS"&&i>=1) return a[i%2===1?1:2]; if (f==="COUNTIFS") return a[i%2];
    if (f==="LET") return i<2?a[i]:a[2]; if (f==="CALCULATE"&&i>=1) return a[1];
    return a[Math.min(i,a.length-1)];
  }
  function update(){ ctx=tokenBefore(); items=ctx?suggestions(ctx):[];
    if (ctx && ctx.kind==="word" && items.length===1 && items[0].label.toLowerCase()===ctx.frag.toLowerCase() && items[0].type!=="fx") items=[];
    sel=0; render(); renderTip(); }
  function accept(){
    const it=items[sel]; if (!it||!ctx) return;
    const v=input.value, pos=input.selectionStart??v.length;
    let after=v.slice(pos);
    if (it.insert.endsWith("]") && after.startsWith("]")) after=after.slice(1);
    if (it.insert.endsWith("(") && after.startsWith("(")) after=after.slice(1);
    input.value=v.slice(0,ctx.start)+it.insert+after;
    const p=ctx.start+it.insert.length; input.setSelectionRange(p,p);
    input.dispatchEvent(new Event("input",{bubbles:true})); update();
  }
  input.addEventListener("input", update);
  input.addEventListener("click", update);
  input.addEventListener("keyup", e=>{ if (["ArrowLeft","ArrowRight","Home","End"].includes(e.key)) update(); });
  input.addEventListener("focus", update);
  input.addEventListener("blur", ()=>setTimeout(()=>{ box.hidden=true; tip.hidden=true; },120));
  input.addEventListener("keydown", e=>{
    if (box.hidden) return;
    if (e.key==="ArrowDown"){ sel=(sel+1)%items.length; render(); e.preventDefault(); }
    else if (e.key==="ArrowUp"){ sel=(sel-1+items.length)%items.length; render(); e.preventDefault(); }
    else if (e.key==="Tab"){ accept(); e.preventDefault(); }
    else if (e.key==="Escape"){ items=[]; render(); e.preventDefault(); }
    else if (e.key==="Enter"){ box.hidden=true; }
  }, true);
}

p9:{group:"Power Query", kind:"pq", source:"JHB_Rates", others:["CPT_Rates"], title:"Compare two files: lanes missing in CPT",
 task:"JHB_Rates (from the Excel file) and CPT_Rates (from the CSV) should list the same lanes. Return the JHB rows whose Lane doesn't appear in the CPT file at all.",
 steps:[{op:"merge",p:{col:"Lane",with:"CPT_Rates",key:"Lane",join:"Left anti (rows only in first)",expand:[],prefix:true}}],
 h:["This is a Merge on Lane, but the join kind does the work.","Left anti keeps rows from the first query that have no match in the second. You don't need to bring in any columns."],
 w:"Anti joins are the reconciliation tool. Left anti = in the first file only; Right anti = in the second file only (here that would show CPT-GRJ, a lane only Cape Town has).",
 m:"Using a Left outer join and scanning for blanks by eye. Also check the keys first: Power Query joins are case-sensitive, and \"jnb-dur\" or a trailing space won't match \"JNB-DUR\"."},
p10:{group:"Power Query", kind:"pq", source:"JHB_Rates", others:["CPT_Rates"], title:"Compare two files: rates that changed",

 steps:[{op:"merge",p:{col:"Lane",with:"CPT_Rates",key:"Lane",join:"Inner (only matching rows)",expand:["Rate"],prefix:true}},{op:"addcol",p:{name:"Difference",a:"CPT_Rates.Rate",op:"−  subtract",b:"Rate"}},{op:"filter",p:{col:"Difference",op:"does not equal",val:"0"}}],

d1:{group:"Data model & DAX", kind:"dax", title:"Your first measure", rows:{table:"Shipments",col:"Branch"}, existing:[], fmt:"r",
 task:"Create a measure called Total Revenue that sums Shipments[Revenue (R)]. The pivot shows it by branch.",
 sol:{name:"Total Revenue", expr:"SUM(Shipments[Revenue (R)])"},
 h:["A measure is Name = expression. The expression here is one function.","SUM(Shipments[Revenue (R)])."],
 w:"The same measure gives a different number in every pivot row because each row filters the data to one branch. That's filter context.",
 m:"Writing Shipments[Revenue (R)] without SUM. A measure must return one value, so a bare column is an error."},
d2:{group:"Data model & DAX", kind:"dax", title:"Change the filter with CALCULATE", rows:{table:"Shipments",col:"Branch"}, fmt:"r",
 existing:[{name:"Total Revenue",expr:"SUM(Shipments[Revenue (R)])"}],
 task:"Create Express Revenue: [Total Revenue], but only for the Express service.",
 must:/CALCULATE\s*\(/i, mustMsg:"This exercise practises CALCULATE. Reuse [Total Revenue] inside it.",
 sol:{name:"Express Revenue", expr:"CALCULATE([Total Revenue], Shipments[Service] = \"Express\")"},
 h:["CALCULATE(expression, filter1, …) evaluates the expression with changed filters.","The filter is Shipments[Service] = \"Express\"."],
 w:"CALCULATE adds the Express filter on top of the branch filter from the pivot row. Reusing [Total Revenue] means the sum logic lives in one place.",
 m:"Using SUMIFS. That's an Excel worksheet function; in DAX, CALCULATE does the filtering."},
d3:{group:"Data model & DAX", kind:"dax", title:"Percent of total with ALL", rows:{table:"Shipments",col:"Branch"}, fmt:"pct",
 existing:[{name:"Total Revenue",expr:"SUM(Shipments[Revenue (R)])"}],
 task:"Create % of Total: each branch's revenue as a share of ALL revenue. The Total row should show 100%.",
 sol:{name:"% of Total", expr:"DIVIDE([Total Revenue], CALCULATE([Total Revenue], ALL(Shipments)))"},
 h:["You need two numbers: revenue in the current row, and revenue ignoring the row's filter.","CALCULATE([Total Revenue], ALL(Shipments)) removes the filters. Divide with DIVIDE."],
 w:"ALL removes the branch filter, so the denominator is the grand total in every row. DIVIDE returns blank instead of an error if the total is ever 0.",
 m:"Dividing by SUM(Shipments[Revenue (R)]) without ALL. It's filtered too, so every row shows 100%."},
d4:{group:"Data model & DAX", kind:"dax", title:"Filter through a relationship", rows:{table:"Shipments",col:"Branch"}, fmt:"r",
 existing:[{name:"Total Revenue",expr:"SUM(Shipments[Revenue (R)])"}],
 task:"Tier lives in the Clients table, which is related to Shipments by Client. Create Gold Revenue: revenue from Gold-tier clients, by branch.",
 sol:{name:"Gold Revenue", expr:"CALCULATE([Total Revenue], Clients[Tier] = \"Gold\")"},
 h:["You filter Clients, not Shipments. The relationship carries the filter over.","CALCULATE([Total Revenue], Clients[Tier] = \"Gold\")."],
 w:"Filters flow from the one side (Clients) to the many side (Shipments). That's why a star schema with dimension tables needs no lookups in the fact table.",
 m:"Trying to add a Tier column to Shipments first. With a relationship you don't need to copy data across."},
d5:{group:"Data model & DAX", kind:"dax", title:"Row by row with SUMX and RELATED", rows:{table:"Clients",col:"Account manager"}, fmt:"r2",
 existing:[{name:"Total Revenue",expr:"SUM(Shipments[Revenue (R)])"}],
 task:"Commission is 5% of revenue for Gold-tier clients and 3% for everyone else. Create a Commission measure. The pivot shows it by account manager.",
 must:/SUMX\s*\(/i, mustMsg:"Calculate it row by row with SUMX.",
 sol:{name:"Commission", expr:"SUMX(Shipments, Shipments[Revenue (R)] * IF(RELATED(Clients[Tier]) = \"Gold\", 0.05, 0.03))"},
 h:["The rate depends on each shipment's client, so work row by row: SUMX(Shipments, …).","On a Shipments row, RELATED(Clients[Tier]) fetches that client's tier."],
 w:"SUMX evaluates the expression for each visible shipment and adds the results. RELATED follows the relationship from the shipment to its client.",
 m:"Writing SUM(Shipments[Revenue (R)]) * 0.05 inside IF. The tier must be checked per shipment, not once for the whole group."},
d6:{group:"Data model & DAX", kind:"dax", title:"Average per shipment", rows:{table:"Shipments",col:"Service"}, fmt:"r2",
 existing:[{name:"Total Revenue",expr:"SUM(Shipments[Revenue (R)])"}],
 task:"Create Avg per Shipment: total revenue divided by the number of shipments, by service. Reuse [Total Revenue].",
 sol:{name:"Avg per Shipment", expr:"DIVIDE([Total Revenue], COUNTROWS(Shipments))"},
 h:["COUNTROWS(Shipments) counts the shipments visible in the current filter.","DIVIDE([Total Revenue], COUNTROWS(Shipments))."],
 w:"Building measures from other measures keeps logic in one place. AVERAGE(Shipments[Revenue (R)]) gives the same answer here, but the ratio pattern works for any two measures.",
 m:"Using / instead of DIVIDE. A slicer that leaves no shipments makes / throw an error; DIVIDE returns blank."},

v1:{group:"VBA & automation", kind:"vba", title:"Refresh everything",
 task:"Complete the macro so it refreshes every query, connection and pivot in the workbook.",
 code:["Sub RefreshEverything()","    ' Refresh every query, connection and pivot","    ___","    MsgBox \"All data refreshed\"","End Sub"],
 accept:[/^(ThisWorkbook|ActiveWorkbook)\.RefreshAll$/i],
 wrong:[[/\.Refresh$/i,"Refresh updates one object, like a single query table. You need the workbook-level method that refreshes everything."],[/calculate/i,"Calculate recalculates formulas but doesn't reload query data."]],
 answer:"ThisWorkbook.RefreshAll",
 result:"Every Power Query, data connection and PivotTable reloads, then the message box appears.",
 h:["The method belongs to the workbook object.","ThisWorkbook means the file the macro is stored in."],
 w:"RefreshAll is the button on the Data tab, as code. Pair it with a button or Workbook_Open for one-click reports.",
 m:"If queries are set to refresh in the background, pivots can refresh before the data arrives. Turn off background refresh in the query properties."},
v2:{group:"VBA & automation", kind:"vba", title:"Speed up a macro",
 task:"This macro does a lot of copying and formatting. Add the first line that stops Excel redrawing the screen while it runs.",
 code:["Sub BuildReport()","    ___","    ' … lots of copying and formatting …","    Application.ScreenUpdating = True","End Sub"],
 accept:[/^Application\.ScreenUpdating\s*=\s*False$/i],
 wrong:[[/ScreenUpdating\s*=\s*True/i,"True turns screen updating on. You want it off at the start."],[/^ScreenUpdating/i,"ScreenUpdating is a property of Application: Application.ScreenUpdating."]],
 answer:"Application.ScreenUpdating = False",
 result:"The macro runs without flickering and finishes much faster; the screen refreshes once at the end.",
 h:["It's a property of the Application object.","Set it to False at the start; the last line already sets it back to True."],
 w:"Redrawing after every action is slow. Switching it off often makes a macro many times faster.",
 m:"Forgetting to set it back to True, especially in an error handler. Excel can look frozen afterwards."},
v3:{group:"VBA & automation", kind:"vba", title:"Loop through files in a folder",
 task:"The loop should process every .xlsx file in C:\\Rates. Add the line that moves to the next file.",
 code:["Sub ImportRates()","    Dim f As String","    f = Dir(\"C:\\Rates\\*.xlsx\")","    Do While f <> \"\"","        Debug.Print f   ' open and process the file here","        ___","    Loop","End Sub"],
 accept:[/^f\s*=\s*Dir(\s*\(\s*\))?$/i],
 wrong:[[/Dir\s*\(\s*"/i,"Calling Dir with the pattern again restarts the search, so you get the first file forever: an endless loop."],[/^Dir/i,"Assign the result back to f, or the loop never ends."]],
 answer:"f = Dir()",
 result:"Each file name is printed once: the loop stops when Dir() returns an empty string.",
 h:["The first Dir call set the folder and pattern.","Calling Dir again with no arguments returns the next match."],
 w:"Dir remembers the pattern between calls. Each Dir() moves to the next file and returns \"\" when there are none left, which ends the loop.",
 m:"Calling Dir(\"C:\\Rates\\*.xlsx\") again inside the loop. That restarts at the first file every time."},
v4:{group:"VBA & automation", kind:"vba", title:"Find the last row of data",
 task:"Complete the line so lastRow holds the last used row in column A, even when there are gaps in the data.",
 code:["Sub ShowLastRow()","    Dim lastRow As Long","    lastRow = ___","    MsgBox \"Data ends on row \" & lastRow","End Sub"],
 accept:[/^((ActiveSheet|ws|Sheets\("[^"]+"\)|Worksheets\("[^"]+"\))\.)?Cells\(\s*((ActiveSheet|ws)\.)?Rows\.Count\s*,\s*("A"|1)\s*\)\.End\(\s*xlUp\s*\)\.Row$/i],
 wrong:[[/xlDown/i,"xlDown stops at the first blank cell, so gaps in the data give the wrong row. Start at the bottom and go up."],[/UsedRange/i,"UsedRange can include cells that were formatted or cleared, so it often overshoots."],[/End\(xlUp\)$/i,"That returns the cell. Add .Row to get its row number."]],
 answer:"Cells(Rows.Count, \"A\").End(xlUp).Row",
 result:"A message box shows the row of the last filled cell in column A.",
 h:["Start at the very bottom of column A: Cells(Rows.Count, \"A\").","Jump up to the last filled cell with .End(xlUp), then take .Row."],
 w:"It works like pressing Ctrl+Up from the bottom of the sheet. Blank cells in the middle don't matter.",
 m:"Using .End(xlDown) from the top. One blank row in the data and the macro stops early."},
v5:{group:"VBA & automation", kind:"vba", title:"Write a spilling formula from VBA",
 task:"Put the formula =SORT(UNIQUE(Shipments[Branch])) into H5 so that it spills like it would if you typed it.",
 code:["Sub AddBranchList()","    ' Write a dynamic array formula into H5","    ___","End Sub"],
 accept:[/^((ActiveSheet|ws|Sheets\("[^"]+"\)|Worksheets\("[^"]+"\))\.)?(Range\("H5"\)|\[H5\])\.Formula2\s*=\s*"=\s*SORT\(\s*UNIQUE\(\s*Shipments\[Branch\]\s*\)\s*\)"$/i],
 wrong:[[/\.Formula\s*=/i,"With .Formula, Excel treats it as an old-style formula and adds @, so you get one value instead of a spill. Use .Formula2."],[/\.Value\s*=/i,".Value behaves like .Formula for formulas, so Excel adds @. Use .Formula2."],[/Formula2\s*=\s*"[^=]/i,"The formula text must start with = inside the quotes."]],

 w:".Formula2 writes formulas the way Microsoft 365 reads them, with spilling. .Formula keeps the old single-value behaviour for compatibility.",
 m:"Using .Formula. Excel inserts @ and the result no longer spills."},

const NOTES = {
"Core formulas": { lead:"The everyday workhorses: conditional sums and counts, IF, and dates. Most analyst reports are built on these.",
 sec:[
  {h:"SUMIFS and COUNTIFS", b:[
   {p:"Add up (or count) only the rows that meet every condition. Conditions always come in pairs: the column to test, then what to look for."},
   {code:`=SUMIFS(sum_range, criteria_range1, criteria1, criteria_range2, criteria2, …)
=COUNTIFS(criteria_range1, criteria1, …)`},
   {p:"Example: Cape Town revenue from Express shipments."},
   {code:`=SUMIFS(Shipments[Revenue (R)], Shipments[Branch], "Cape Town", Shipments[Service], "Express")`},
   {tbl:[["\"Cape Town\"","Equals (not case-sensitive)"],["\">=300\"","Operator and number, inside quotes"],["\">=\"&DATE(2026,1,1)","Operator joined to a value with &"],["\"Cape*\"","Wildcard: starts with Cape"],["\"<>Total\"","Not equal to"]]},
   {warn:"Never write the condition as a comparison, like Shipments[Date]>=DATE(2026,1,1). SUMIFS wants the range and the condition as two separate arguments."}]},
  {h:"IF and IFS", b:[
   {code:`=IF(logical_test, value_if_true, value_if_false)
=IFS(test1, value1, test2, value2, TRUE, default)`},
   {p:"Give IF a whole column and it returns one answer per row, which spills: `=IF(Shipments[Weight (kg)]>=500, \"Heavy\", \"Standard\")`."},
   {tip:"Test for the specific problem, like B2=0, rather than wrapping everything in IFERROR. IFERROR also hides typos and broken references."}]},
  {h:"Dates are numbers", b:[
   {p:"Excel stores each date as a count of days since 1 January 1900. 1 Jan 2026 is 46023. That's why you can subtract dates, and why a number can suddenly display as a date (or the reverse) when the format changes."},
   {tbl:[["DATE(y, m, d)","Build a date. Always use this rather than typing 2026-01-01"],["YEAR / MONTH / DAY","Pull a part out of a date"],["EOMONTH(date, n)","Last day of the month, n months away (0 = this month)"],["EDATE(date, n)","Same day n months away"],["WEEKDAY(date, 2)","1 = Monday … 7 = Sunday"],["NETWORKDAYS(start, end)","Working days between, both ends included"],["WORKDAY(start, n)","Date n working days later"],["DAYS(end, start)","Days between (or just subtract)"],["TEXT(date, \"mmm yyyy\")","A label like Jan 2026 (returns text)"]]},

  {h:"Common errors", b:[
   {tbl:[["#VALUE!","Wrong type of value, e.g. text where a number is needed"],["#DIV/0!","Dividing by zero or an empty cell"],["#NAME?","Misspelt function or name, or text without quotes"],["Answer shows as a date","Only the format is wrong. Change it to General or Number"]]}]}
 ]},
"Spill basics": { lead:"In Microsoft 365, one formula can return many values. They spill into the cells below and beside it.",
 sec:[
  {h:"What a spill is", b:[
   {p:"Type `=UNIQUE(Shipments[Branch])` in one cell and it fills as many rows as there are branches. Only the first cell holds the formula; the rest is the spill range, shown with a blue border in Excel (dashed green here)."},
   {list:["Don't drag spilling formulas down. One formula is the whole answer.","The spill resizes by itself when the data changes.","You can't edit or delete one cell inside a spill. Change the formula instead."]}]},
  {h:"The # spill reference", b:[
   {p:"`H5#` means the whole spill that starts in H5, however big it is today. Use it to feed other formulas, charts and data validation lists."},

I5:  =COUNTIFS(Shipments[Branch], H5#)`},
   {tip:"COUNTIFS, SUMIFS, XLOOKUP and most other functions return one result per item when you give them a spill. That's how a whole summary table grows from a few formulas."}]},
  {h:"Lifting", b:[

 ]},

   {code:`H5:  =SORT(UNIQUE(Shipments[Branch]))
I5:  =SUMIFS(Shipments[Revenue (R)], Shipments[Branch], H5#)`},
   {p:"One spill holds the keys; a second formula calculates one value per key by pointing at it with #."}]},
  {h:"One formula with LET and HSTACK", b:[
   {code:`=LET(b, SORT(UNIQUE(Shipments[Branch])),
    HSTACK(b, SUMIFS(Shipments[Revenue (R)], Shipments[Branch], b)))`}]},
  {h:"Cross-tabs: rows × columns", b:[
   {p:"A column spill and a row spill together give a grid: SUMIFS runs once per combination."},
   {code:`I5:  =TRANSPOSE(SORT(UNIQUE(Shipments[Service])))
H6:  =SORT(UNIQUE(Shipments[Branch]))
I6:  =SUMIFS(Shipments[Revenue (R)], Shipments[Branch], H6#, Shipments[Service], I5#)`}]},
  {h:"GROUPBY and PIVOTBY", b:[
   {p:"The newest Microsoft 365 builds have pivot functions. Use 0, 0 for no header row and no totals."},
   {code:`=GROUPBY(Shipments[Branch], Shipments[Revenue (R)], SUM, 0, 0)
=PIVOTBY(Shipments[Branch], Shipments[Service], Shipments[Revenue (R)], SUM)`},
   {tip:"Formula summaries vs PivotTables: formulas update live and can feed other formulas; PivotTables are faster to explore and handle very large data. Analysts use both."}]}
 ]},
"Lookups": { lead:"Bring a value across from another table. XLOOKUP is the modern default.",
 sec:[
  {h:"XLOOKUP", b:[
   {code:`=XLOOKUP(lookup_value, lookup_array, return_array, [if_not_found], [match_mode], [search_mode])`},
   {tbl:[["match_mode 0","Exact match (the default)"],["match_mode -1 / 1","Exact or next smaller / next larger, e.g. rate bands"],["match_mode 2","Wildcards * and ?"],["search_mode -1","Search from the bottom: finds the latest match"]]},
   {code:`=XLOOKUP("Baobab Traders", Shipments[Client], Shipments[Revenue (R)], , 0, -1)`}]},
  {h:"Look up a whole list at once", b:[
   {p:"Give XLOOKUP a spill as the lookup value and it returns one answer per item:"},
   {code:`=XLOOKUP(H5#, Clients[Client], Clients[Account manager])`}]},
  {h:"Two conditions", b:[
   {code:`=XLOOKUP(1, (Shipments[Branch]="Durban") * (Shipments[Service]="Road"), Shipments[ID])`},
   {p:"The multiplication gives 1 only where both are true; XLOOKUP finds the first 1."}]},
  {h:"INDEX and MATCH, and why not VLOOKUP", b:[
   {code:`=INDEX(Clients[Tier], MATCH("Fynbos Pharma", Clients[Client], 0))`},
   {list:["Always use 0 in MATCH for an exact match.","VLOOKUP uses a column number, which points at the wrong data when someone inserts a column.","VLOOKUP defaults to approximate match, which gives silent wrong answers."]}]},
  {h:"Why #N/A?", b:[
   {list:["Extra spaces: \"Durban \" isn't \"Durban\". Fix with TRIM or in Power Query.","Numbers stored as text, or the reverse.","The value really isn't there. Use if_not_found to show a clear message."]}]}
 ]},
"Tables & names": { lead:"Tables and names make formulas readable and make them grow with the data.",
 sec:[
  {h:"Excel Tables", b:[
   {p:"Select your data and press Ctrl+T. The table gets a name (Table Design → Table Name) and every column becomes referable by its header. New rows are included automatically in every formula, chart and PivotTable that uses the table."}]},
  {h:"Structured references", b:[
   {tbl:[["Shipments[Revenue (R)]","The whole column (data rows only)"],["Shipments","The whole table body"],["Clients[[Client]:[Tier]]","Adjacent columns from Client to Tier"],["Shipments[#Headers]","The header row"],["[@[Revenue (R)]]","This row's value: calculated columns only"]]},
   {p:"Column names with spaces or brackets need double brackets after @: `[@[Weight (kg)]]`; simple names don't: `[@Branch]`."},
   {warn:"Avoid cell ranges like Data!G2:G31. They don't grow with the data and don't say what they mean. These drills only accept table references."}]},
  {h:"Calculated columns", b:[
   {p:"Type one formula in a new column of a table and Excel fills it for every row, including rows added later."},
   {code:`=ROUND([@[Revenue (R)]] / [@[Weight (kg)]], 2)`}]},
  {h:"Named constants", b:[
   {p:"Formulas → Name Manager → New. Name: VatRate, Refers to: =0.15. Then write `*(1+VatRate)` anywhere. When the rate changes, you update it once."},
   {list:["Names start with a letter, have no spaces, and can't look like a cell address (KG1 is a cell).","Scope: workbook names work everywhere; sheet names only on one sheet.","Avoid OFFSET-based dynamic ranges. They're volatile and slow; tables or # do the job better."]}]}
 ]},
"LET & LAMBDA": { lead:"Name the steps of a calculation, then turn reusable calculations into your own functions.",
 sec:[
  {h:"LET", b:[
   {code:`=LET(name1, value1, name2, value2, …, final_calculation)`},
   {code:`=LET(
    ct,    SUMIFS(Shipments[Revenue (R)], Shipments[Branch], "Cape Town"),
    total, SUM(Shipments[Revenue (R)]),
 ct / total)`},
   {list:["Each named value is calculated once, so long formulas get faster.","Later names can use earlier ones.","Use Alt+Enter to put each step on its own line."]},
   {warn:"Names can only use letters, numbers, _ and full stops. cpt_% fails because % means divide by 100, and names like kg1 fail because they look like cell addresses."}]},
  {h:"Keep columns aligned", b:[
   {p:"When you build a table with HSTACK, every column must be in the same order as the key column. Sorting one column on its own (SORT around a SUMIFS) breaks the pairing. To order the table, sort the finished table:"},
   {code:`=SORT(HSTACK(b, ROUND(rev/kg, 2)), 2, -1)`}]},
  {h:"LAMBDA: your own functions", b:[
   {code:`=LAMBDA(x, x * 1.15)(1000)      ← test it in a cell: returns 1150`},
   {p:"When it works, copy the LAMBDA part into Name Manager. Name: RPK, Refers to: `=LAMBDA(rev, kg, ROUND(rev/kg, 2))`. Now `=RPK(…, …)` works like a built-in function."}]},
  {h:"Helper functions", b:[
   {tbl:[["MAP(array, LAMBDA(x, …))","Run a calculation for each item"],["BYROW(array, LAMBDA(row, …))","One result per row"],["BYCOL(array, LAMBDA(col, …))","One result per column"],["REDUCE(start, array, LAMBDA(acc, x, …))","Roll everything up into one value"]]},
   {p:"Use MAP when the per-item calculation itself returns an array, like a distinct count with UNIQUE and FILTER, which SUMIFS-style lifting can't do."}]}
 ]},
"Power Query": { lead:"Clean and reshape data with recorded steps that replay on every refresh.",
 sec:[
  {h:"How it works", b:[
   {p:"Data → Get Data opens the Power Query editor. Each click becomes an Applied Step, recorded in the M language (View → Advanced Editor). Next month you drop in the new file and click Refresh All; every step runs again."},
   {list:["Source: where the data comes from (file, folder, table, database).","Transform: the steps.","Load: to a sheet, or Only Create Connection and add to the Data Model."]}]},
  {h:"Where data comes from", b:[
   {p:"The Source step says which connector to use. Each one returns something different."},
   {tbl:[["Excel.Workbook(File.Contents(\"…xlsx\"))","Another Excel file. Returns the navigation list (below)"],["Excel.CurrentWorkbook()","Tables and named ranges in this workbook"],["Csv.Document(File.Contents(\"…csv\"))","A CSV or text file. Just rows of text, no sheets or tables"],["Folder.Files(\"C:\\Rates\")","Every file in a folder, one row per file"],["SharePoint.Files(…)","Files on SharePoint or OneDrive for Business"],["Sql.Database(server, db)","A database table or query"]]},
   {tip:"A file on your C: drive and a file on a network share or SharePoint are just different paths in the Source step. Once both queries are cleaned, Power Query treats them the same."}]},
  {h:"The navigation list: Name, Data, Item, Kind, Hidden", b:[
   {p:"When you connect to an Excel file, the first thing Power Query returns is a list of everything inside it, one row per item:"},
   {tbl:[["Name","The item's name, e.g. Rates or tblRates"],["Data","The item's contents, shown as Table. This is what you open"],["Item","The exact name used to find it (for named ranges, like Rates!Print_Area)"],["Kind","What type of item it is (see below)"],["Hidden","TRUE if the sheet is hidden"]]},
   {p:"The Kind column is the important one:"},
   {tbl:[["Sheet","The whole worksheet grid: titles, blank rows, everything. Columns come in as Column1, Column2…"],["Table","An Excel Table (Ctrl+T): real headers, data rows only, grows with the data"],["DefinedName","A named range, such as a print area"]]},
   {code:`Source = Excel.Workbook(File.Contents("C:\\Rates\\JHB_RateCard.xlsx"), null, true),
tblRates = Source{[Item="tblRates", Kind="Table"]}[Data]`},
   {p:"Clicking Table next to an item in the Navigator writes that second line: find the row where Item and Kind match, then take its Data."},
   {tip:"Choose Table over Sheet whenever the file has one. A Sheet connection breaks when someone adds a title row or moves the data; a Table doesn't."},
   {warn:"\"The key didn't match any rows in the table\" means the item was renamed or deleted: a sheet called Rates became Rates Oct. Fix the name in the navigation step."}]},
  {h:"Combining many items: filter by Kind, then expand", b:[
   {p:"To stack every Table in a workbook (or every file in a folder), don't open them one by one. Work on the list itself:"},
   {list:["Filter Kind = Table (drops sheets and named ranges, which would duplicate the data).","Keep Name and Data (Name tells you which item each row came from).","Expand the Data column and pick the columns to bring out."]},
   {p:"Next month's table is picked up automatically on Refresh."}]},
  {h:"Join kinds", b:[
   {p:"Merge queries joins two tables on a matching column. The join kind decides which rows you get:"},
   {tbl:[["Left outer","All rows from the first, plus matches from the second (the usual lookup)"],["Inner","Only rows found in both"],["Left anti","Rows in the first with no match in the second"],["Right anti","Rows in the second with no match in the first"],["Full outer","Every row from both, matched where possible"],["Right outer","All rows from the second, plus matches from the first"]]}]},
  {h:"Comparing two files from different sources", b:[
   {list:["Bring both into their own queries and clean them so the key and value columns have the same names and types.","Clean the key: Trim, fix case. Joins are case-sensitive, so jnb-dur doesn't match JNB-DUR.","Missing from file 2: Merge with Left anti.","New in file 2: Merge with Right anti.","Changed values: Merge with Inner, bring in file 2's value, Add column = new − old, filter where it isn't 0.","One reconciliation table: Full outer, then flag rows where either side is null or the values differ."]},
   {tip:"Keep the prefix when you expand (e.g. CPT_Rates.Rate) so it's always clear which file each value came from."}]},
  {h:"Key transformations", b:[
   {tbl:[["Remove top rows, Use first row as headers","Fix report-style files"],["Trim, Capitalize Each Word, Replace values","Clean text"],["Change type","Make numbers and dates real numbers and dates"],["Filter rows","Drop totals, blanks and test rows"],["Unpivot other columns","Months across columns → rows"],["Group by","Summarise, like a pivot"],["Merge queries","Join columns from another table (a lookup)"],["Append queries","Stack tables with the same columns"]]}]},
  {h:"Unpivot OTHER columns", b:[
   {p:"Select the ID columns (e.g. Branch) and choose Unpivot Other Columns. Next quarter's new month columns are unpivoted automatically. Selecting Jan–Mar and choosing Unpivot Columns would ignore April."}]},
  {h:"Merge vs Append", b:[
   {tbl:[["Merge","Adds columns from another table where a key matches, like XLOOKUP for a whole table"],["Append","Adds rows from tables with the same layout, like VSTACK"]]},
   {p:"Comparing files uses Merge (side by side, on a key). Combining monthly files uses Append (one under the other)."}]},
  {h:"Folder queries and errors", b:[
   {p:"Get Data → From Folder → Combine combines every file with the same layout in a folder: the standard way to handle monthly files."},
   {warn:"\"The column 'X' of the table wasn't found\" means a source header changed. Steps such as Changed Type store column names, so fix the header at the source or edit that step."}]}
 ]},
"Data model & DAX": { lead:"Relate tables instead of looking values up, and write measures that calculate for whatever the report is showing.",
 sec:[
  {h:"The model", b:[
   {p:"Load tables to the Data Model and relate them on a key. A star schema has a fact table (Shipments: many rows of transactions) linked to dimension tables (Clients, Dates, Branches) with one row per item."},
   {code:`Clients[Client]  1 ──── ∞  Shipments[Client]`},
   {p:"Filters flow from the one side to the many side: filter Clients[Tier] and Shipments is filtered too."}]},
  {h:"Measures vs calculated columns", b:[
   {tbl:[["Measure","Calculated when the report asks, for the current filters. Use for totals, ratios, KPIs"],["Calculated column","Stored per row at refresh. Use for row attributes you'll filter or group by"]]},
   {code:`Total Revenue := SUM(Shipments[Revenue (R)])`}]},
  {h:"Filter context and CALCULATE", b:[
   {p:"Every cell of a pivot has its own filters (this branch, this month…). The same measure gives a different number in each cell. CALCULATE changes those filters:"},
   {code:`Express Revenue := CALCULATE([Total Revenue], Shipments[Service] = "Express")
% of Total      := DIVIDE([Total Revenue], CALCULATE([Total Revenue], ALL(Shipments)))`},
   {tip:"ALL removes filters. Dividing by the ALL version gives a share of the grand total in every row."}]},
  {h:"Iterators: SUMX and RELATED", b:[
   {p:"When the calculation depends on each row, iterate:"},
   {code:`Commission := SUMX(Shipments,
    Shipments[Revenue (R)] * IF(RELATED(Clients[Tier]) = "Gold", 0.05, 0.03))`},
   {p:"RELATED fetches a value from the one side of the relationship for the current row."}]},
  {h:"Habits", b:[
   {list:["Build measures on measures: reuse [Total Revenue] rather than repeating SUM.","Use DIVIDE instead of / so empty filters give blank, not an error.","SUMIFS and VLOOKUP are worksheet functions; in DAX, CALCULATE and relationships do that work."]}]}
 ]},
"VBA & automation": { lead:"Automate the repetitive parts: refreshing, formatting, and processing files.",
 sec:[
  {h:"Where code lives", b:[
   {tbl:[["Standard Module (Insert → Module)","Normal macros you run with a button or Alt+F8"],["ThisWorkbook module","Workbook events like Workbook_Open"],["Sheet modules","Events for one sheet, e.g. Worksheet_Change"]]},
   {warn:"Save as .xlsm. Saving as .xlsx deletes the macros."}]},
  {h:"Patterns you'll use constantly", b:[
   {code:`ThisWorkbook.RefreshAll                          ' refresh queries, connections, pivots
Application.ScreenUpdating = False               ' speed up; set True at the end
lastRow = Cells(Rows.Count, "A").End(xlUp).Row   ' last used row in column A
Range("H5").Formula2 = "=SORT(UNIQUE(Shipments[Branch]))"   ' write a spilling formula`}]},
  {h:"Looping through files", b:[
   {code:`f = Dir("C:\\Rates\\*.xlsx")
Do While f <> ""
    ' open and process f here
    f = Dir()          ' next file; "" when done
Loop`}]},
  {h:"Events", b:[
   {code:`Private Sub Workbook_Open()      ' in ThisWorkbook
    ThisWorkbook.RefreshAll
End Sub`},
   {p:"Auto_Open is the old approach and only works in a standard module."}]},
  {h:"Good habits", b:[
   {list:["Use Formula2, not Formula, when writing dynamic array formulas, or Excel adds @.","Turn off background refresh on queries if a macro must wait for data before refreshing pivots.","Add an error handler that switches ScreenUpdating back on.","Prefer Power Query or formulas over VBA when they can do the job: they're easier for others to maintain."]}]}
 ]}
};

 w:"UNIQUE returns an array. Excel spills that array down from H5, sizing the result to fit. Add a new branch to the Table and the list grows on its own.",

 s:[["H5","=SORT(UNIQUE(Shipments[Client]))"]],
 w:"Dynamic array functions nest. UNIQUE hands its array straight to SORT, which hands its array to the grid.",
 m:"Writing UNIQUE(SORT(...)). It works too, but sorting first does more work on duplicates. Get into the habit of filtering down first, then sorting."},
3:{h:["H5 is exercise 2 again, but for branches.","In I5, use COUNTIFS with H5# as the criteria. The # means 'the whole spill that starts in H5'."],
 s:[["H5","=SORT(UNIQUE(Shipments[Branch]))"],["I5","=COUNTIFS(Shipments[Branch],H5#)"]],
 w:"When you give COUNTIFS an array of criteria, it returns one count per item, so I5 spills alongside H5. Because it points at H5#, the counts resize whenever the branch list does.",
 m:"Using H5:H8 instead of H5#. A fixed range breaks as soon as a branch is added or removed."},
4:{h:["SEQUENCE(12) gives the numbers 1 to 12 in a column.","Use that array as the month argument of DATE."],
 s:[["H5","=DATE(2026,SEQUENCE(12),1)"]],
 w:"DATE accepts an array for any argument and returns an array of dates. This is called lifting: a normal function becomes a spilling one when you feed it an array.",
 m:"Seeing numbers like 46023. That's the right answer as a date serial; format the cells as dates."},
5:{h:["FILTER(array, include) keeps rows where include is TRUE.","CHOOSECOLS(Shipments,4,7) picks Client (column 4) and Revenue (column 7)."],
 s:[["H5",'=FILTER(CHOOSECOLS(Shipments,4,7),Shipments[Branch]="Cape Town")']],
 w:"The condition Shipments[Branch]=\"Cape Town\" produces 30 TRUE/FALSE values, one per row. FILTER keeps the TRUE rows from the two chosen columns.",
 m:"Filtering the whole Table and then trying to delete columns. Choose the columns first, or wrap the FILTER in CHOOSECOLS."},
6:{h:["In array logic, AND is multiplication: TRUE*TRUE = 1, anything with FALSE = 0.","Wrap each condition in brackets: (condition1)*(condition2)."],
 s:[["H5",'=FILTER(CHOOSECOLS(Shipments,1,4,7),(Shipments[Branch]="Johannesburg")*(Shipments[Service]="Express"))']],
 w:"Each bracket returns 30 TRUE/FALSE values. Multiplying them gives 1 only where both are TRUE, and FILTER treats 1 as keep.",
 m:"Using AND(...). AND collapses everything to one TRUE or FALSE for the whole table, so FILTER can't use it row by row."},
7:{h:["In array logic, OR is addition: any TRUE makes the sum at least 1.","Return Shipments[ID] only."],
 s:[["H5",'=FILTER(Shipments[ID],(Shipments[Service]="Overnight")+(Shipments[Revenue (R)]>10000))']],
 w:"Adding the two condition arrays gives 0, 1 or 2 per row. FILTER keeps anything that isn't 0, so a row that meets both conditions still appears once.",
 m:"Using OR(...) — same problem as AND: it returns a single value, not one per row."},
8:{h:["SORTBY sorts one array by another. Use -1 for descending.","TAKE(array, 5) keeps the first 5 rows."],
 s:[["H5","=TAKE(SORTBY(CHOOSECOLS(Shipments,1,4,7),Shipments[Revenue (R)],-1),5)"]],
 w:"SORTBY lets you sort by a column that isn't in the output. Here the three chosen columns are ordered by revenue, then TAKE trims to the top 5.",
 m:"Sorting before choosing columns and then using SORT(...,3,-1) on the wrong index. SORTBY with the named column avoids counting columns."},
9:{h:["FILTER has a third argument: what to return when nothing matches.","Without it, an empty result shows #CALC!."],
 s:[["H5",'=FILTER(Shipments[ID],(Shipments[Branch]="Durban")*(Shipments[Revenue (R)]>5000),"None found")']],
 w:"Dashboards break when a filter returns nothing. The if_empty argument gives a clean message instead of an error.",
 m:"Wrapping in IFERROR. It works, but it also hides real mistakes such as a mistyped column name."},
10:{h:["Two-step version: H5 lists the branches, I5 uses SUMIFS with H5#.","One-formula version: LET to name the branch list, then HSTACK it next to the SUMIFS."],
 s:[["H5","=SORT(UNIQUE(Shipments[Branch]))"],["I5","=SUMIFS(Shipments[Revenue (R)],Shipments[Branch],H5#)"]],
 alt:[["H5 (one formula)","=LET(b,SORT(UNIQUE(Shipments[Branch])),HSTACK(b,SUMIFS(Shipments[Revenue (R)],Shipments[Branch],b)))"],["H5 (newest Excel)","=GROUPBY(Shipments[Branch],Shipments[Revenue (R)],SUM,0,0)"]],
 w:"This is a pivot table built from formulas. It updates instantly with no Refresh, which makes it ideal for dashboards.",
 m:"Leaving out the 0,0 in GROUPBY. Then you get a header row and a total row, and the size no longer matches."},
11:{h:["TRANSPOSE turns a vertical spill into a horizontal one.","In I6, give SUMIFS one criteria spill that runs down (H6#) and one that runs across (I5#)."],
 s:[["I5","=TRANSPOSE(SORT(UNIQUE(Shipments[Service])))"],["H6","=SORT(UNIQUE(Shipments[Branch]))"],["I6","=SUMIFS(Shipments[Revenue (R)],Shipments[Branch],H6#,Shipments[Service],I5#)"]],
 alt:[["H5 (newest Excel)","=PIVOTBY(Shipments[Branch],Shipments[Service],Shipments[Revenue (R)],SUM,0,0,,0)"]],
 w:"A column array paired with a row array broadcasts into a grid: 4 branches × 3 services = 12 SUMIFS from one formula. This pattern is the core of formula-driven dashboards.",
 m:"Using H6#:H6# or adding $ signs. Spill references don't need anchoring; H6# and I5# are already the full ranges."},
12:{h:["XLOOKUP's first argument can be a whole array of lookup values.","Look up H5# in Clients[Client] and return Clients[Account manager]."],
 s:[["H5","=SORT(UNIQUE(Shipments[Client]))"],["I5","=XLOOKUP(H5#,Clients[Client],Clients[Account manager])"]],
 w:"Give XLOOKUP 8 lookup values and it returns 8 answers. One formula replaces a column of VLOOKUPs that would otherwise need filling down and maintaining.",
 m:"Using VLOOKUP with a column number. If someone inserts a column in Clients, the number points at the wrong data. XLOOKUP's return column can't drift."},
13:{h:["XLOOKUP normally returns the first match, which here is the oldest shipment.","Its 6th argument, search_mode, set to -1 searches from the bottom up."],
 s:[["H5",'=XLOOKUP("Baobab Traders",Shipments[Client],Shipments[Revenue (R)],,0,-1)']],
 w:"Because the data is in date order, the last match is the latest. The empty 4th argument (if_not_found) and the 0 (exact match) keep the defaults.",
 m:"Using MAXIFS on revenue. That returns the biggest shipment, not the most recent one."},
14:{h:["LET(name1, value1, name2, value2, final_calculation).","Name the Cape Town total ct and the overall total total, then return ct/total."],
 s:[["H5",'=LET(ct,SUMIFS(Shipments[Revenue (R)],Shipments[Branch],"Cape Town"),total,SUM(Shipments[Revenue (R)]),ct/total)']],
 w:"LET turns one long formula into readable steps, and each named step is calculated once. Someone reviewing your model can follow the logic without untangling brackets.",
 m:"Typing 0.27 or a rounded value. The check needs the live calculation, and so does any real report."},
15:{h:["Name three things in LET: the branch list, revenue per branch, kg per branch.","Finish with HSTACK(branches, ROUND(revenue/kg, 2))."],
 s:[["H5","=LET(b,SORT(UNIQUE(Shipments[Branch])),rev,SUMIFS(Shipments[Revenue (R)],Shipments[Branch],b),kg,SUMIFS(Shipments[Weight (kg)],Shipments[Branch],b),HSTACK(b,ROUND(rev/kg,2)))"]],
 w:"Everything from this session in one formula: a spilled key list, lifted SUMIFS, array maths (rev/kg works element by element) and HSTACK to shape the output. If you can write this, you can build a dynamic dashboard.",
 m:"Dividing the total revenue by total weight once. That gives a single company-wide figure, not one per branch."}
};

const isDate=v=>Number.isInteger(v)&&v>=45658&&v<=46752;
const fmtDate=v=>XL.fromSerial(v).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric",timeZone:"UTC"});
const grp=(n,d)=>Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}).replace(/,/g," ");
function fmt(v, kind){
  if (kind && typeof kind==="object") return fmtK(v, kind);
  if (v===null||v===undefined) return "";
  if (XL.isE(v)) return v.err;
  if (typeof v==="object" && v.lam) return "LAMBDA";
  if (typeof v==="boolean") return v?"TRUE":"FALSE";
  if (typeof v==="number"){
    const sg=v<0?"-":"";
    if (kind==="money") return sg+"R "+grp(v,Number.isInteger(v)?0:2);
    if (kind==="date") return fmtDate(v);
    if (kind==="pct"||kind===true) return (v*100).toFixed(1)+"%";
    if (kind==="2dp") return sg+grp(v,2);
    if (Number.isInteger(v)) return sg+grp(v,0);
    return String(+v.toFixed(4)); }
  return String(v);
}
const MN3=["January","February","March","April","May","June","July","August","September","October","November","December"];
function fmtK(v, f){
  if (typeof v!=="number") return fmt(v);
  const d=f.dec, auto=n=>Number.isInteger(n)?0:2, sg=v<0?"-":"";
  if (f.kind==="general") return fmt(v);
  if (f.kind==="number") return sg+grp(v, d??auto(v));
  if (f.kind==="money") return sg+"R "+grp(v, d??auto(v));
  if (f.kind==="pct") return (v*100).toFixed(d??1)+"%";
  if (f.kind==="date") return Number.isInteger(v)?fmtDate(v):fmt(v);
  if (f.kind==="longdate"){ if (!Number.isInteger(v)) return fmt(v); const x=XL.fromSerial(v); return `${x.getUTCDate()} ${MN3[x.getUTCMonth()]} ${x.getUTCFullYear()}`; }
  return fmt(v);
}
const AUTO2K={money:{kind:"money"},date:{kind:"date"},pct:{kind:"pct",dec:1},"2dp":{kind:"number",dec:2}};
function colFmt(e,col){ const u=(saved.fmt[e.id]||{})[col]; if (u) return u; const k=colKind(e,col); return k?AUTO2K[k]:{kind:"general"}; }
// number format for an answer column, from its heading (like a formatted Excel column)
function colKind(e, col){
  if (e.cross) return col>=9?"money":null;
  const h=(e.heads||[])[col-8]||"";
  if (/share|%/i.test(h)) return "pct";
  if (/month start|date$|^date/i.test(h)) return "date";
  if (/per kg/i.test(h)) return "2dp";
  if (/\(R\)|revenue|vat/i.test(h)) return "money";
  return null;
}

function codeRow(tag,f,use){ return `<div class="code"><span class="tag">${esc(tag)}</span><pre>${esc(f)}</pre>${use!==undefined?`<button class="use" data-use="${esc(use)}">Use</button>`:""}</div>`; }
function solutionHTML(e){

function useSolution(e,which){
