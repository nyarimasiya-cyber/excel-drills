function expectedHTML(e){
  if (e.kind==="sheet"){ const ex=expectedRun(e), bb=bbox(ex.grid); const rows=[]; for (let r=bb.r1;r<=bb.r2;r++){ const row=[]; for (let c=bb.c1;c<=bb.c2;c++){ const x=ex.grid.get(r+","+c); row.push(x?x.v:null);} rows.push(row); }
    const head=e.cross?rows.shift():(e.heads||[]); return miniTable(head,rows,bb.c1,e.cross?5:4,c=>{ const k=colKind(e,c); return k?AUTO2K[k]:null; }); }

function miniTable(head, rows, c0, r0, kinds){
  let h=`<div class="gridwrap ${rows.length>12?"tall":""}"><table class="xl"><thead><tr><th></th>${Array.from({length:Math.max(head.length,(rows[0]||[]).length)},(_,j)=>`<th>${XL.colName(c0+j)}</th>`).join("")}</tr></thead><tbody>`;

  return h+`</tbody></table></div>`;
}

function bbox(grid){ let r1=1e9,c1=1e9,r2=0,c2=0; for (const k of grid.keys()){ const [r,c]=k.split(",").map(Number); r1=Math.min(r1,r); c1=Math.min(c1,c); r2=Math.max(r2,r); c2=Math.max(c2,c);} return r2?{r1,c1,r2,c2,rows:r2-r1+1,cols:c2-c1+1}:null; }
function expectedRun(e){ if (!expCache[e.id]){ XL.setNames(e.names_sol||[]); expCache[e.id]=XL.runSheet(e.sol.map(([c,f])=>({cell:c.split(" ")[0],f}))); } return expCache[e.id]; }
const formulas=e=>e.inputs.map(c=>({cell:c,f:(saved.f[e.id]||{})[c]||""}));
const userNames=e=>saved.names[e.id]||[{name:"",f:""}];
function same(a,b){ const bl=v=>v===null||v===undefined; if (bl(a)&&bl(b)) return true;
  if (bl(a)) a=typeof b==="string"?"":0; if (bl(b)) b=typeof a==="string"?"":0;
  if (XL.isE(a)||XL.isE(b)) return false;
  if (typeof a==="number"&&typeof b==="number") return Math.abs(a-b)<1e-6;
  if (typeof a==="string"&&typeof b==="string") return a.toLowerCase()===b.toLowerCase(); return a===b; }
const COLS_INS=["Shipments[Branch]","Shipments[Client]","Shipments[Service]","Shipments[Revenue (R)]","Shipments[Weight (kg)]","Shipments[Date]","Shipments[ID]","Clients[Client]","Clients[Tier]","Clients[Account manager]"];
function lintFormula(f){
  const noStr=f.replace(/"[^"]*"/g,'""');
  if (/(^|[^\w"])\d{4}-\d{1,2}-\d{1,2}(?![\w"])/.test(noStr)) return {title:"2026-01-01 isn't a date in a formula.",msg:"Excel reads it as maths: 2026 minus 1 minus 1 = 2024. Build dates with DATE(2026,1,1)."};
  let ast; try { ast=XL.parse(f); } catch(x){ return null; }
  const IFS=["SUMIFS","COUNTIFS","AVERAGEIFS","MAXIFS","MINIFS","SUMIF","COUNTIF"], CMP=["=","<>","<",">","<=",">="];
  let hit=null;
  (function walk(n){ if (!n||typeof n!=="object"||hit) return;
    if (n.k==="call"&&IFS.includes(n.f)&&n.args.some(a=>a.k==="bin"&&CMP.includes(a.o)))

const REFC=["#2f6fdf","#c2410c","#7c3aed","#0f766e","#be185d","#a16207"];
function showView(e,cell,on){

function describe(v){
  if (v===undefined) return {head:"Not calculated", body:"This part didn't run (for example, the other branch of an IF)."};
  const m=Array.isArray(v)?v:[[v]];
  const r=m.length, c=m[0].length;
  if (r===1&&c===1){ const x=m[0][0];
    if (XL.isE(x)) return {head:x.err, body:`${XL_ERR[x.err]||""} ${x.msg||""}`.trim(), err:true};
    if (x&&x.lam) return {head:"A LAMBDA function", body:`Takes ${x.params.length} value(s): ${x.params.join(", ")}.`};
    return {head:fmt(x)===""?"(empty)":fmt(x), body:typeof x==="string"?"Text":typeof x==="number"?(isDate(x)&&Number.isInteger(x)?`A number (formatted as a date it would read ${fmtDate(x)})`:"A number"):typeof x==="boolean"?"TRUE/FALSE":""}; }

  else prev=m.slice(0,3).map(row=>row.slice(0,4).map(x=>fmt(x)).join(" | ")+(c>4?" | …":"")).join("  ·  ")+(r>3?`  … (+${r-3} rows)`:"");
  let extra=""; if (tf.length===flatv.length){ const t=tf.filter(Boolean).length; extra=` ${t} TRUE, ${tf.length-t} FALSE.`; }
  if (errs) extra+=` ${errs} error value${errs>1?"s":""}.`;
  return {head:`${r} row${r>1?"s":""} × ${c} column${c>1?"s":""}`, body:prev+(extra?"."+extra:"")};
}

      else if (ev.key.length===1&&!ev.ctrlKey&&!ev.metaKey&&!ev.altKey){ ev.preventDefault(); openCellEditor(td.dataset.cell, ev.key); }
    });
  });
  sh._lastR=lastR; if (!sh._wired){ sh._wired=true; wireSelection(e,sh); }
  let cb=document.getElementById("chartbox"); const chh=chartHTML(e); if (cb) cb.outerHTML=chh||"<div id=\"chartbox\" hidden></div>"; else document.getElementById("sheetwrap").insertAdjacentHTML("afterend", chh||"<div id=\"chartbox\" hidden></div>");
  const t=tipEl();
  sh.onmousemove=ev=>{ const td=ev.target.closest("td[data-err]"); if (!td){ if (t.dataset.src==="grid") t.hidden=true; return; }
    const er=td.dataset.err; t.dataset.src="grid";
    t.innerHTML=`<b class="bad">⚠ ${esc(er==="#ERROR"?"There's a problem with this formula.":er)}</b>${er!=="#ERROR"?`<span>${esc(XL_ERR[er]||"")}</span>`:""}${td.dataset.msg?`<span>${esc(td.dataset.msg)}</span>`:""}`;
    t.hidden=false; placeTip(t,ev); };
  sh.onmouseleave=()=>{ if (t.dataset.src==="grid") t.hidden=true; };
}

// ---------- menus & dialogs ----------
function closeMenus(){ document.querySelectorAll(".rmenu").forEach(m=>m.remove()); }
function openMenu(btn, html, wire){
  closeMenus(); const m=document.createElement("div"); m.className="rmenu"; m.innerHTML=html;
  document.body.appendChild(m); const r=btn.getBoundingClientRect();
  m.style.left=Math.min(r.left, innerWidth-m.offsetWidth-8)+"px"; m.style.top=(r.bottom+4)+"px";
  wire(m); setTimeout(()=>document.addEventListener("mousedown",function h(ev){ if (!m.contains(ev.target)){ m.remove(); document.removeEventListener("mousedown",h); } }),0);
}
function dialog(title, body, buttons, onWire){
  const o=document.createElement("div"); o.className="xdlg-wrap"; o.innerHTML=`<div class="xdlg" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="xdlg-h"><span>${esc(title)}</span><button class="xdlg-x" aria-label="Close">×</button></div><div class="xdlg-b">${body}</div><div class="xdlg-f">${buttons}</div></div>`;
  document.body.appendChild(o); const close=()=>o.remove();
  o.querySelector(".xdlg-x").onclick=close; o.addEventListener("mousedown",ev=>{ if (ev.target===o) close(); });
  o.addEventListener("keydown",ev=>{ if (ev.key==="Escape") close(); });
  onWire&&onWire(o,close); (o.querySelector("[autofocus]")||o.querySelector("button")).focus(); return close;
}
function excelMsg(text, tip){ dialog("Microsoft Excel", `<div class="xmsg"><span class="xmsg-i">!</span><div><p>${esc(text)}</p>${tip?`<p class="small">${esc(tip)}</p>`:""}</div></div>`, `<button class="btn sm" data-ok autofocus>OK</button>`, (o,c)=>o.querySelector("[data-ok]").onclick=c); }

// ---------- actions ----------
function needSel(){ if (!sel){ flashStatus("Select a cell or drag across a range first."); return false; } return true; }
function flashStatus(t){ setStatus({state:"info",title:t,msg:""}); }
function styleSel(e, fn){ if (!needSel()) return; const S=sty(e); selKeys().forEach(k=>{ S.cells[k]=fn({...(S.cells[k]||{})})||{}; if (!Object.keys(S.cells[k]).length) delete S.cells[k]; }); persist(); rerender(e); }
function toggleSel(e, prop){ if (!needSel()) return; const S=sty(e); const all=selKeys().every(k=>(S.cells[k]||{})[prop]); styleSel(e,s=>{ if (all) delete s[prop]; else s[prop]=true; return s; }); }
function rerender(e){ renderSheet(e,lastRun,lastDiffs); ribbonSync(e); }
function activeFormulaBox(){ const ced=document.getElementById("cell-ed"); if (ced && !document.getElementById("celled").hidden) return ced; return document.getElementById("in-"+activeCell); }
function insertFn(e, name){
  const ta=activeFormulaBox(); if (!ta) return; ta.classList.remove("ghost"); const fv=document.getElementById("fv-"+(ta.dataset.cell||activeCell)); if (fv) fv.hidden=true;
  insertAt(ta, name+"(", ()=>{ const c=ta.dataset.cell||activeCell; (saved.f[e.id]=saved.f[e.id]||{})[c]=ta.value; persist(); if (ta.id==="cell-ed"){ const fb=document.getElementById("in-"+c); fb.value=ta.value; } });
  ta.dispatchEvent(new Event("input",{bubbles:true}));
}
function selValues(){ if (!sel||!lastRun) return []; const rows=[]; for (let r=sel.r1;r<=sel.r2;r++){ const row=[]; for (let c=sel.c1;c<=sel.c2;c++){ const x=lastRun.grid.get(r+","+c); row.push(x?x.v:null);} rows.push(row);} return rows; }
function resultRange(){ if (!lastRun) return null; const b=bbox(lastRun.grid); return b?{r1:b.r1,c1:b.c1,r2:b.r2,c2:b.c2}:null; }

function ribbonAction(e, a, btn){
  const S=sty(e);
  switch(a){
    case "copy": { if (!needSel()) return; const e2=byId[cur]; const tsv=[]; for (let r=sel.r1;r<=sel.r2;r++){ const row=[]; for (let c=sel.c1;c<=sel.c2;c++){ const x=lastRun&&lastRun.grid.get(r+","+c); row.push(x?fmt(x.v,cellFmt(e2,r,c)):""); } tsv.push(row.join("\t")); }
      const ok=()=>flashStatus(`Copied ${selName()}. Paste it into Excel or an email.`);
      try { navigator.clipboard.writeText(tsv.join("\n")).then(ok,()=>flashStatus("Your browser blocked copying here.")); } catch(x){ flashStatus("Your browser blocked copying here."); } return; }
    case "bold": return toggleSel(e,"b"); case "italic": return toggleSel(e,"i"); case "underline": return toggleSel(e,"u");
    case "left": case "center": case "right": return styleSel(e,s=>{ s.al=s.al===a?undefined:a; if (!s.al) delete s.al; return s; });
    case "wrap": return toggleSel(e,"wrap");
    case "money": return styleSel(e,s=>({...s,num:{kind:"money",dec:2}}));
    case "pct": return styleSel(e,s=>({...s,num:{kind:"pct",dec:0}}));
    case "comma": return styleSel(e,s=>({...s,num:{kind:"number",dec:2}}));
    case "inc": case "dec": { if (!needSel()) return; const f=cellFmt(e,sel.r1,sel.c1); const base=["number","money","pct"].includes(f.kind)?f:{kind:"number"};
      const x=lastRun&&lastRun.grid.get(sel.r1+","+sel.c1); const sample=x&&typeof x.v==="number"?x.v:0; const d0=base.dec??(base.kind==="pct"?1:(Number.isInteger(sample)?0:2));
      return styleSel(e,s=>({...s,num:{...base,dec:Math.max(0,Math.min(6,d0+(a==="inc"?1:-1)))}})); }
    case "clearfmt": if (!needSel()) return; selKeys().forEach(k=>delete S.cells[k]); S.cf=S.cf.filter(r=>!(r.r1>=sel.r1&&r.r2<=sel.r2&&r.c1>=sel.c1&&r.c2<=sel.c2)); persist(); return rerender(e);
    case "autosum": return insertFn(e,"SUM");
    case "fx": return fxDialog(e);
    case "names": { const nb=document.querySelector(".nm-box"); if (nb){ nb.scrollIntoView({block:"center",behavior:"smooth"}); nb.classList.add("flash"); setTimeout(()=>nb.classList.remove("flash"),1200); document.getElementById("nmn0")?.focus(); }
      else excelMsg("This workbook has no defined names yet.","Name Manager is used in the Tables & names and LAMBDA exercises, where you create names like VatRate and RPK."); return; }
    case "showf": VIEW.showF=!VIEW.showF; saveView(); return renderEx();
    case "errchk": { const errs=lastRun?[...lastRun.grid].filter(([k,v])=>XL.isE(v.v)):[]; if (!errs.length) return excelMsg("The error check of the entire sheet has been completed.","No errors found.");
      const [k,v]=errs[0]; const [r,c]=k.split(",").map(Number); sel={r1:r,c1:c,r2:r,c2:c}; rerender(e);
      return dialog("Error Checking", `<p><b>Error in cell ${XL.colName(c)}${r}</b></p><p class="mono">${esc(v.v.err)}</p><p>${esc(XL_ERR[v.v.err]||"")}</p><p class="small">${esc(v.v.msg||"")}</p>`, `<button class="btn sm ghost" data-eval>Show Calculation Steps…</button><button class="btn sm" data-ok autofocus>OK</button>`, (o,cl)=>{ o.querySelector("[data-ok]").onclick=cl; o.querySelector("[data-eval]").onclick=()=>{ cl(); evalDialog(e, v.anchor); }; }); }
    case "evalf": return evalDialog(e, activeCell);
    case "calc": case "refresh": sheetRun(e,true); return flashStatus(a==="refresh"?"Refreshed: every formula recalculated.":"Calculated.");
    case "getdata": { const p=EXS.find(x=>x.kind==="pq"); return dialog("Get Data", `<p>Get Data opens <b>Power Query</b>, where you clean and reshape data with Applied Steps.</p><p class="small">The Power Query exercises practise this with a real step editor and its M code.</p>`, `<button class="btn sm ghost" data-ok>Close</button><button class="btn sm" data-go autofocus>Open Power Query exercises</button>`, (o,cl)=>{ o.querySelector("[data-ok]").onclick=cl; o.querySelector("[data-go]").onclick=()=>{ cl(); go(p.id); }; }); }
    case "pivot": { const d=EXS.find(x=>x.kind==="dax"); return dialog("PivotTable", `<p>Pivots in the Data Model are driven by <b>measures</b> written in DAX.</p><p class="small">Or do it with formulas: GROUPBY and PIVOTBY build a pivot that updates without Refresh (see Summaries).</p>`, `<button class="btn sm ghost" data-ok>Close</button><button class="btn sm" data-go autofocus>Open DAX exercises</button>`, (o,cl)=>{ o.querySelector("[data-ok]").onclick=cl; o.querySelector("[data-go]").onclick=()=>{ cl(); go(d.id); }; }); }
    case "table": return excelMsg("The source data on this page is already in Tables: Shipments and Clients.","That's why you can write Shipments[Branch] instead of Data!C2:C31. Tables grow automatically when rows are added.");
    case "sortaz": case "sortza": case "filter": case "dedupe": case "t2c": {
      const spill=sel&&lastRun&&[...selKeys()].some(k=>lastRun.grid.get(k));
      const tip={sortaz:"Sort the result with a formula instead: wrap it in SORT( ), or SORT(…, 1, -1) for Z→A.",sortza:"Use SORT(…, sort_index, -1) for largest first, or SORTBY to sort by another column.",filter:"Use the FILTER function, so the result updates by itself when the data changes.",dedupe:"Use UNIQUE( ) to remove duplicates with a formula.",t2c:"Power Query's Split Column, or the TEXTSPLIT function, splits text without changing the source."}[a];
      if (spill) return excelMsg("You can't change part of an array.", tip);
      return excelMsg("Select some data in your result first.", tip); }
    case "ch-col": case "ch-bar": case "ch-line": case "ch-pie": { const rg=(sel&&(sel.r2>sel.r1||sel.c2>sel.c1))?{...sel}:resultRange();
      if (!rg) return excelMsg("Run a formula first, then select its result to chart it.");
      S.chart={type:a.slice(3),...rg}; persist(); rerender(e); document.getElementById("chartbox")?.scrollIntoView({block:"nearest",behavior:"smooth"}); return; }
    case "ch-del": S.chart=null; persist(); return rerender(e);
    case "v-grid": VIEW.grid=!VIEW.grid; saveView(); return renderEx();
    case "v-heads": VIEW.heads=!VIEW.heads; saveView(); return renderEx();
    case "v-fbar": VIEW.fbar=!VIEW.fbar; saveView(); return renderEx();
  }
  if (/^z\d+$/.test(a)){ VIEW.zoom=+a.slice(1); saveView(); return renderEx(); }
}
function menuAction(e, which, btn){
  if (which==="color"||which==="fill"){ const P=which==="color"?PAL:FILL;
    return openMenu(btn, `<div class="rmenu-h">${which==="color"?"Font colour":"Fill colour"}</div><div class="swatches">${P.map(([n,c])=>`<button class="swatch" data-c="${c}" title="${n}" aria-label="${n}" style="background:${c||"var(--surface)"}">${c?"":"∅"}</button>`).join("")}</div>`,
      m=>m.querySelectorAll(".swatch").forEach(b=>b.onclick=()=>{ closeMenus(); styleSel(e,s=>{ if (b.dataset.c) s[which==="color"?"fc":"bg"]=b.dataset.c; else delete s[which==="color"?"fc":"bg"]; return s; }); })); }
  if (which==="border") return openMenu(btn, `<div class="rmenu-h">Borders</div>${[["all","All borders"],["outside","Outside border"],["bottom","Bottom border"],["none","No border"]].map(([k,l])=>`<button class="mi" data-b="${k}">${l}</button>`).join("")}`,
    m=>m.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{ closeMenus(); if (!needSel()) return; const k=b.dataset.b; const S=sty(e);
      selKeys().forEach(key=>{ const [r,c]=key.split(",").map(Number); const s={...(S.cells[key]||{})}; delete s.bd;
        if (k==="all") s.bd="tblr"; else if (k==="outside"){ let x=""; if (r===sel.r1) x+="t"; if (r===sel.r2) x+="b"; if (c===sel.c1) x+="l"; if (c===sel.c2) x+="r"; if (x) s.bd=x; } else if (k==="bottom"&&r===sel.r2) s.bd="b";
        if (Object.keys(s).length) S.cells[key]=s; else delete S.cells[key]; }); persist(); rerender(e); }));
  if (which==="cf") return openMenu(btn, `<div class="rmenu-h">Conditional formatting</div>
      <div class="mi-form"><span>Highlight cells greater than</span><input type="number" id="cf-gt" placeholder="e.g. 20000"><button class="btn sm" data-cf="gt">Apply</button></div>
      <div class="mi-form"><span>Highlight cells less than</span><input type="number" id="cf-lt" placeholder="e.g. 10000"><button class="btn sm" data-cf="lt">Apply</button></div>
      <div class="mi-form"><span>Highlight text that contains</span><input type="text" id="cf-tx" placeholder="e.g. Cape"><button class="btn sm" data-cf="tx">Apply</button></div>
      <button class="mi" data-cf="bars">Data bars</button><button class="mi" data-cf="scale">Colour scale (red → green)</button><button class="mi" data-cf="top3">Top 3 values</button><button class="mi" data-cf="clear">Clear rules from selection</button>`,
    m=>m.querySelectorAll("[data-cf]").forEach(b=>b.onclick=()=>{ if (!needSel()){ closeMenus(); return; } const S=sty(e), t=b.dataset.cf; closeMenus();
      if (t==="clear"){ S.cf=S.cf.filter(r=>!(r.r1<=sel.r2&&r.r2>=sel.r1&&r.c1<=sel.c2&&r.c2>=sel.c1)); }
      else { const val=t==="gt"?m.querySelector("#cf-gt").value:t==="lt"?m.querySelector("#cf-lt").value:t==="tx"?m.querySelector("#cf-tx").value:null;
        if ((t==="gt"||t==="lt")&&val==="") return flashStatus("Enter a value for the rule."); if (t==="tx"&&!val) return flashStatus("Enter the text to look for.");
        S.cf.push({...sel,type:t,val}); }
      persist(); rerender(e); }));
  if (which.startsWith("cat:")){ const cat=which.slice(4);
    return openMenu(btn, `<div class="rmenu-h">${esc(cat)}</div>${FCAT[cat].map(f=>`<button class="mi fn" data-fn="${f}"><b>${f}</b><span>${esc((SIGS_XL[f]||["",""])[1])}</span></button>`).join("")}`,
      m=>m.querySelectorAll("[data-fn]").forEach(b=>b.onclick=()=>{ closeMenus(); insertFn(e,b.dataset.fn); })); }

function fxDialog(e){
  let cat="All", q="", pick=null;
  const list=()=>{ const all=cat==="All"?[...new Set(Object.values(FCAT).flat())].sort():FCAT[cat]; return all.filter(f=>!q||f.toLowerCase().includes(q)||(SIGS_XL[f]||["",""])[1].toLowerCase().includes(q)); };
  dialog("Insert Function", `<label class="xl-lbl">Search for a function<input type="text" id="fx-q" placeholder="Describe what you want to do, e.g. lookup, sort, count" autofocus></label>
      <label class="xl-lbl">Or select a category<select id="fx-cat"><option>All</option>${Object.keys(FCAT).map(k=>`<option>${esc(k)}</option>`).join("")}</select></label>
      <div class="fx-list" id="fx-list" role="listbox"></div><div class="fx-desc" id="fx-desc"></div>`,
    `<button class="btn sm ghost" data-cancel>Cancel</button><button class="btn sm" data-ok>OK</button>`,
    (o,close)=>{
      const L=o.querySelector("#fx-list"), D=o.querySelector("#fx-desc");
      const draw=()=>{ const fs=list(); if (!fs.includes(pick)) pick=fs[0]||null;

// ---------- Evaluate Formula ----------
function shortVal(v){
  const m=Array.isArray(v)?v:[[v]]; const one=x=>XL.isE(x)?x.err:x&&x.lam?"LAMBDA":typeof x==="string"?`"${x}"`:typeof x==="boolean"?(x?"TRUE":"FALSE"):x===null||x===undefined?"0":String(+(+x).toFixed(6));
  if (m.length===1&&m[0].length===1) return one(m[0][0]);
  const rows=m.slice(0,4).map(r=>r.slice(0,4).map(one).join(",")+(r.length>4?",…":""));
  return "{"+rows.join(";")+(m.length>4?";…":"")+"}";
}
function evalDialog(e, cell){
  cell=cell||e.inputs[0];
  const f=(saved.f[e.id]||{})[cell]||"";
  if (!f.trim()) return excelMsg(`Cell ${cell} is empty.`,"Type a formula there first, then use Evaluate Formula to watch it calculate step by step.");
  if (!lastRun||lastRunF[cell]!==f) sheetRun(e,false);
  const res=lastRun.res[cell];
  if (!res||!res.ast) return excelMsg("There's a problem with this formula.", res&&res.parseErr||"");
  // evaluation order: children before parents
  const order=[]; (function w(n){ if (!n||typeof n!=="object") return; ["l","r","e","fn"].forEach(k=>w(n[k])); (n.args||[]).forEach(w); if (n.s!==undefined&&res.trace.has(n)) order.push(n); })(res.ast);
  let step=0;
  const render=()=>{ const done=order.slice(0,step); const nxt=order[step];
    const top=done.filter(n=>!done.some(o=>o!==n&&o.s<=n.s&&o.e>=n.e));
    let h="", i=0; const marks=[...top.map(n=>({n,t:"v"})), ...(nxt&&!top.some(o=>o.s<=nxt.s&&o.e>=nxt.e)?[{n:nxt,t:"u"}]:[])].sort((a,b)=>a.n.s-b.n.s);
    for (const mk of marks){ if (mk.n.s<i) continue; h+=esc(f.slice(i,mk.n.s));
      if (mk.t==="v") h+=`<span class="ev-val">${esc(shortVal(res.trace.get(mk.n)))}</span>`;
      else { let inner=""; let j=mk.n.s; for (const t of top.filter(o=>o.s>=mk.n.s&&o.e<=mk.n.e).sort((a,b)=>a.s-b.s)){ inner+=esc(f.slice(j,t.s))+`<span class="ev-val">${esc(shortVal(res.trace.get(t)))}</span>`; j=t.e; } inner+=esc(f.slice(j,mk.n.e)); h+=`<u class="ev-next">${inner}</u>`; }
      i=mk.n.e; }
    h+=esc(f.slice(i));
    const finished=step>=order.length;
    return {h, finished, nxt}; };
  dialog("Evaluate Formula", `<p class="small">Reference: <b class="mono">${cell}</b>. Press Evaluate to calculate the underlined part. Values in green are already calculated.</p><div class="ev-box" id="ev-box"></div><p class="small" id="ev-note"></p>`,
    `<button class="btn sm ghost" data-restart>Restart</button><button class="btn sm ghost" data-close>Close</button><button class="btn sm" data-step autofocus>Evaluate</button>`,
    (o,close)=>{ const B=o.querySelector("#ev-box"), N=o.querySelector("#ev-note"), S=o.querySelector("[data-step]");
      const draw=()=>{ const r=render(); B.innerHTML=r.finished?`<span class="ev-val big">${esc(shortVal(res.val))}</span>`:r.h;
        N.textContent=r.finished?"That's the final result of the formula.":`Next: ${f.slice(r.nxt.s,r.nxt.e).replace(/\s+/g," ").slice(0,80)}`; S.disabled=r.finished; };
      S.onclick=()=>{ step++; draw(); }; o.querySelector("[data-restart]").onclick=()=>{ step=0; draw(); S.disabled=false; S.focus(); }; o.querySelector("[data-close]").onclick=close; draw(); });
}

// ---------- styles at render ----------
function cellFmt(e,r,c){ const s=(sty(e).cells[r+","+c]||{}); if (s.num) return s.num; return colFmt(e,c); }
function cellStyle(e,r,c,v,colStats){
  const s=sty(e).cells[r+","+c]||{}; const st=[]; const cls=[];
  if (s.b) st.push("font-weight:700"); if (s.i) st.push("font-style:italic"); if (s.u) st.push("text-decoration:underline");
  if (s.fc) st.push(`color:${s.fc}`); if (s.bg) st.push(`background:${s.bg}`); if (s.al) st.push(`text-align:${s.al}`); if (s.wrap) st.push("white-space:normal;max-width:160px");
  if (s.bd){ const b="1.5px solid var(--ink)"; if (s.bd.includes("t")) st.push(`border-top:${b}`); if (s.bd.includes("b")) st.push(`border-bottom:${b}`); if (s.bd.includes("l")) st.push(`border-left:${b}`); if (s.bd.includes("r")) st.push(`border-right:${b}`); }
  for (const rule of sty(e).cf){ if (r<rule.r1||r>rule.r2||c<rule.c1||c>rule.c2) continue; const n=typeof v==="number";
    if (rule.type==="gt"&&n&&v>+rule.val) st.push("background:#fecaca;color:#7f1d1d");
    if (rule.type==="lt"&&n&&v<+rule.val) st.push("background:#fef08a;color:#713f12");
    if (rule.type==="tx"&&typeof v==="string"&&v.toLowerCase().includes(String(rule.val).toLowerCase())) st.push("background:#bbf7d0;color:#14532d");
    if ((rule.type==="bars"||rule.type==="scale"||rule.type==="top3")&&n){ const k=JSON.stringify([rule.r1,rule.c1,rule.r2,rule.c2]); const S=colStats[k]; if (!S) continue;
      if (rule.type==="bars"){ const p=S.max>S.min0?Math.round((v-S.min0)/(S.max-S.min0)*100):100; st.push(`background:linear-gradient(90deg,rgba(47,111,223,.35) ${p}%,transparent ${p}%)`); }
      if (rule.type==="scale"){ const t=S.max>S.min?(v-S.min)/(S.max-S.min):1; const h=Math.round(t*120); st.push(`background:hsl(${h},70%,82%);color:#1f2937`); }
      if (rule.type==="top3"&&S.top3.includes(v)) st.push("background:#bbf7d0;color:#14532d;font-weight:600"); } }
  return st.join(";");
}
function cfStats(e, grid){ const out={}; for (const rule of sty(e).cf){ const k=JSON.stringify([rule.r1,rule.c1,rule.r2,rule.c2]); if (out[k]) continue; const ns=[];
  for (let r=rule.r1;r<=rule.r2;r++) for (let c=rule.c1;c<=rule.c2;c++){ const x=grid.get(r+","+c); if (x&&typeof x.v==="number") ns.push(x.v); }
  if (ns.length) out[k]={min:Math.min(...ns),max:Math.max(...ns),min0:Math.min(0,...ns),top3:[...ns].sort((a,b)=>b-a).slice(0,3)}; } return out; }

// ---------- chart ----------
function chartHTML(e){
  const ch=sty(e).chart; if (!ch||!lastRun) return "";
  const rows=[]; for (let r=ch.r1;r<=ch.r2;r++){ const row=[]; for (let c=ch.c1;c<=ch.c2;c++){ const x=lastRun.grid.get(r+","+c); row.push(x?x.v:null);} rows.push(row); }
  const data=rows.filter(r=>r.some(v=>v!==null));
  if (!data.length) return `<div class="chartbox" id="chartbox"><p class="small">The charted range is empty. Run your formula, or select a new range and insert the chart again.</p></div>`;
  const ncols=data[0].length; const labelCol=data.every(r=>typeof r[0]!=="number")?0:-1;
  const sCols=[...Array(ncols).keys()].filter(j=>j!==labelCol&&data.some(r=>typeof r[j]==="number")).slice(0,3);
  if (!sCols.length) return `<div class="chartbox" id="chartbox"><p class="small">There are no numbers in the selected range to chart.</p></div>`;
  const labels=data.map((r,i)=>labelCol===0?fmt(r[0]):String(i+1));
  const COL=["#2f6fdf","#c2410c","#15803d"]; const W=640, H=300, pl=70, pr=16, pt=16, pb=44;
  const vals=sCols.flatMap(j=>data.map(r=>typeof r[j]==="number"?r[j]:0)); const max=Math.max(0,...vals), min=Math.min(0,...vals);
  const nice=v=>{ if (v<=0) return 0; const p=Math.pow(10,Math.floor(Math.log10(v))); return Math.ceil(v/p)*p; }; const top=nice(max)||1, bot=min<0?-nice(-min):0;
  const y=v=>pt+(H-pt-pb)*(1-(v-bot)/(top-bot)); const kind=ch.type; const fk=cellFmt(e,ch.r1,ch.c1+sCols[0]);
  const tick=v=>{ const s=fmt(v,fk.kind==="pct"?{kind:"pct",dec:0}:fk.kind==="money"?{kind:"money",dec:0}:{kind:"number",dec:Number.isInteger(v)?0:1}); return s; };
  let g="";

    const PC=["#2f6fdf","#c2410c","#15803d","#a16207","#7e22ce","#0f766e","#be185d","#64748b"];
    vs.forEach((v,i)=>{ const a1=a0+v/tot*2*Math.PI; const large=a1-a0>Math.PI?1:0; g+=`<path d="M${cx},${cy} L${cx+R*Math.cos(a0)},${cy+R*Math.sin(a0)} A${R},${R} 0 ${large} 1 ${cx+R*Math.cos(a1)},${cy+R*Math.sin(a1)} Z" fill="${PC[i%8]}" stroke="var(--surface)" stroke-width="2"><title>${esc(labels[i])}: ${esc(fmt(v,fk))} (${(v/tot*100).toFixed(1)}%)</title></path>`; a0=a1; });
    g+=labels.map((l,i)=>`<rect x="330" y="${40+i*24}" width="12" height="12" fill="${PC[i%8]}"/><text x="350" y="${50+i*24}" font-size="12" fill="var(--ink)">${esc(l)} · ${(vs[i]/tot*100).toFixed(1)}%</text>`).join("");
  } else if (kind==="bar"){ const bh=(H-pt-pb)/data.length; const x=v=>pl+60+(W-pl-60-pr)*((v-bot)/(top-bot));
    for (let k=0;k<=4;k++){ const v=bot+(top-bot)*k/4; g+=`<line x1="${x(v)}" x2="${x(v)}" y1="${pt}" y2="${H-pb}" stroke="var(--line)"/><text x="${x(v)}" y="${H-pb+16}" font-size="11" text-anchor="middle" fill="var(--muted)">${esc(tick(v))}</text>`; }
    data.forEach((r,i)=>{ g+=`<text x="${pl+52}" y="${pt+bh*i+bh/2+4}" font-size="12" text-anchor="end" fill="var(--ink)">${esc(labels[i])}</text>`;
      sCols.forEach((j,s)=>{ const v=typeof r[j]==="number"?r[j]:0; const h=bh*0.7/sCols.length; g+=`<rect x="${Math.min(x(0),x(v))}" y="${pt+bh*i+bh*0.15+s*h}" width="${Math.abs(x(v)-x(0))}" height="${h}" rx="2" fill="${COL[s]}"><title>${esc(labels[i])}: ${esc(fmt(v,fk))}</title></rect>`; }); });
  } else { for (let k=0;k<=4;k++){ const v=bot+(top-bot)*k/4; g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${esc(tick(v))}</text>`; }

    data.forEach((r,i)=>{ if (i%step===0) g+=`<text x="${pl+bw*i+bw/2}" y="${H-pb+16}" font-size="11" text-anchor="middle" fill="var(--ink)">${esc(labels[i].length>12?labels[i].slice(0,11)+"…":labels[i])}</text>`; });
    if (kind==="col") data.forEach((r,i)=>sCols.forEach((j,s)=>{ const v=typeof r[j]==="number"?r[j]:0; const w=bw*0.7/sCols.length; g+=`<rect x="${pl+bw*i+bw*0.15+s*w}" y="${Math.min(y(v),y(0))}" width="${w}" height="${Math.abs(y(0)-y(v))}" rx="2" fill="${COL[s]}"><title>${esc(labels[i])}: ${esc(fmt(v,fk))}</title></rect>`; }));
    else sCols.forEach((j,s)=>{ const pts=data.map((r,i)=>[pl+bw*i+bw/2,y(typeof r[j]==="number"?r[j]:0)]); g+=`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${COL[s]}" stroke-width="2.5"/>`+pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${COL[s]}"><title>${esc(labels[i])}: ${esc(fmt(data[i][j],fk))}</title></circle>`).join(""); });

}
function pqInit(e){ pqForm={op:pqForm.op||"skip",p:{}}; pqRefresh(e,false); }
function pqRefresh(e,user){
  const steps=pqSteps(e), res=PQ.run(PQ_Q[e.source],steps,PQ_Q);
  if (pqSel===null||pqSel>=res.length) pqSel=res.length-1;
  document.getElementById("steps").innerHTML=res.map((r,i)=>`<li class="${i===pqSel?"on":""} ${r.error?"bad":""}"><button class="pick" data-i="${i}" title="${esc(i?stepLabel(steps[i-1]):"Source")}">${r.error?"⚠ ":""}${esc(i?r.name:"Source")}</button>${i?`<button class="x" data-del="${i-1}" aria-label="Delete step">×</button>`:""}</li>`).join("");
  document.querySelectorAll("#steps .pick").forEach(b=>b.onclick=()=>{ pqSel=+b.dataset.i; pqRefresh(e,false); });
  document.querySelectorAll("#steps [data-del]").forEach(b=>b.onclick=()=>{ steps.splice(+b.dataset.del,1); saved.pq[e.id]=steps; persist(); pqSel=null; pqRefresh(e,false); });
  const r=res[pqSel];
  document.getElementById("pqprev").innerHTML = r.error ? `<p class="err-note" style="padding:12px">${esc(r.error)}</p>` : pqTable(r.table, null);
  document.getElementById("mcode").textContent=PQ.mScript(e.source,PQ_SRC_EXPR[e.source]||e.source,res);
  pqFormRender(e,res);
  const fin=res[res.length-1].table, errStep=res.find(x=>x.error);
  if (!steps.length) setStatus({state:"info",title:"Add your first step below the Applied steps list.",msg:"The preview shows the result after the selected step. Compare it with the target table."});
  else if (errStep) setStatus({state:"no",title:`Step "${errStep.name}" has an error.`,msg:errStep.error});
  else { const c=PQ.compare(fin,pqTarget(e),e.checkTypes); if (c.ok) okStatus(markDone(e.id)&&user);
    else { if (fin && fin.cols.some(x=>/^Column\d+$/.test(x)) && !pqTarget(e).cols.some(x=>/^Column\d+$/.test(x))) c.msg=(c.msg||"")+" Column1, Column2… means the headers aren't set: either you opened a Sheet instead of a Table, or the header row still needs promoting.";
      setStatus({state:"no",...c}); } }
}
const TYI={text:"ABC",int:"123",num:"1.2",date:"Date",any:"ABC123",table:"Table",logical:"T/F"};
function pqTable(t,_){
  if (!t) return "";
  let h=`<table class="xl pq"><thead><tr><th></th>${t.cols.map((c,j)=>`<th class="h"><span class="ty">${TYI[t.types[j]]||"ABC123"}</span>${esc(c)}</th>`).join("")}</tr></thead><tbody>`;
  t.rows.slice(0,60).forEach((r,i)=>{ h+=`<tr><th>${i+1}</th>${r.map((v,j)=>{ if (PQ.isTbl(v)) return `<td class="tblc" title="Table: ${esc(v.pqTable.cols.join(", "))} (${v.pqTable.rows.length} rows)">Table</td>`; if (typeof v==="boolean") return `<td>${v?"TRUE":"FALSE"}</td>`; if (PQ.isErr(v)) return `<td class="err" title="${esc(v.pqErr)}">Error</td>`;
    if (v===null||v===undefined) return `<td class="null">null</td>`; const d=t.types[j]==="date"&&typeof v==="number"; return `<td class="${typeof v==="number"?"num":""}">${esc(d?fmtDate(v):typeof v==="number"?fmt(v):v)}</td>`; }).join("")}</tr>`; });
  return h+`</tbody></table>`;
}
function pqFormRender(e,res){
  const good=[...res].reverse().find(x=>x.table); const t=good.table; const op=PQ.OPS[pqForm.op]; const p=pqForm.p;
  const otherQ=pqOthers(e).length?pqOthers(e):Object.keys(PQ_Q).filter(k=>k!==e.source);
  let h=`<label>Add a step<select id="pq-op">${PQ.ORDER.map(k=>`<option value="${k}" ${k===pqForm.op?"selected":""}>${esc(PQ.OPS[k].label)}</option>`).join("")}</select></label>`;
  op.params.forEach(pr=>{
    if (pr.type==="number") h+=`<label>${pr.label}<input type="number" min="0" data-p="${pr.k}" value="${esc(p[pr.k]??"")}"></label>`;
    if (pr.type==="text") h+=`<label>${pr.label}<input type="text" data-p="${pr.k}" value="${esc(p[pr.k]??"")}"></label>`;
    if (pr.type==="select") h+=`<label>${pr.label}<select data-p="${pr.k}">${pr.options.map(o=>`<option ${p[pr.k]===o?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`;
    if (pr.type==="col") h+=`<label>${pr.label}<select data-p="${pr.k}">${pr.optional&&p.agg==="Count rows"?`<option value="">(not needed)</option>`:""}${t.cols.map(c=>`<option ${p[pr.k]===c?"selected":""}>${esc(c)}</option>`).join("")}</select></label>`;
    if (pr.type==="cols") h+=`<label>${pr.label}<span class="checks">${t.cols.map(c=>`<label><input type="checkbox" data-pc="${pr.k}" value="${esc(c)}" ${(p[pr.k]||[]).includes(c)?"checked":""}>${esc(c)}</label>`).join("")}</span></label>`;
    if (pr.type==="query") h+=`<label>${pr.label}<select data-p="${pr.k}" data-re="1"><option value="">Choose…</option>${otherQ.map(q=>`<option ${p[pr.k]===q?"selected":""}>${esc(q)}</option>`).join("")}</select></label>`;
    if (pr.type==="qcol"&&p.with) h+=`<label>${pr.label}<select data-p="${pr.k}">${PQ_Q[p.with].cols.map(c=>`<option ${p[pr.k]===c?"selected":""}>${esc(c)}</option>`).join("")}</select></label>`;
    if (pr.type==="qcols"&&p.with) h+=`<label>${pr.label}<span class="checks">${PQ_Q[p.with].cols.map(c=>`<label><input type="checkbox" data-pc="${pr.k}" value="${esc(c)}" ${(p[pr.k]||[]).includes(c)?"checked":""}>${esc(c)}</label>`).join("")}</span></label>`;
    if (pr.type==="navrow"){ const ni=t.cols.indexOf("Name"), ki=t.cols.indexOf("Kind"), ii=t.cols.indexOf("Item");
      h+= ki<0 ? `<p class="small">This step needs the list a workbook source returns (Name, Data, Item, Kind).</p>`
        : `<label>${pr.label}<select data-p="${pr.k}">${t.rows.map(r=>{ const it=r[ii>=0?ii:ni], v=`${it}|${r[ki]}`; return `<option value="${esc(v)}" ${p[pr.k]===v?"selected":""}>${esc(r[ni])} (${esc(r[ki])})${r[t.cols.indexOf("Hidden")]===true?" · hidden":""}</option>`; }).join("")}</select></label>`; }
    if (pr.type==="tblcol"){ const tc=t.cols.filter((c,j)=>t.rows.some(r=>PQ.isTbl(r[j]))); if (!p[pr.k]&&tc.length) p[pr.k]=tc[0];
      h+= tc.length ? `<label>${pr.label}<select data-p="${pr.k}" data-re="1">${tc.map(c=>`<option ${p[pr.k]===c?"selected":""}>${esc(c)}</option>`).join("")}</select></label>` : `<p class="small">No column here holds tables. Expand is used after a source or merge that returns nested tables.</p>`; }
    if (pr.type==="ncols"){ const j=t.cols.indexOf(p.col); const cs=[]; if (j>=0) t.rows.forEach(r=>{ if (PQ.isTbl(r[j])) r[j].pqTable.cols.forEach(c=>{ if (!cs.includes(c)) cs.push(c); }); });
      h+=`<label>${pr.label}<span class="checks">${cs.map(c=>`<label><input type="checkbox" data-pc="${pr.k}" value="${esc(c)}" ${(p[pr.k]||[]).includes(c)?"checked":""}>${esc(c)}</label>`).join("")||"<span class='small'>Choose the table column first</span>"}</span></label>`; }
    if (pr.type==="check") h+=`<label class="inline"><input type="checkbox" data-pk="${pr.k}" ${(p[pr.k]??pr.def)?"checked":""}>${pr.label}</label>`;
  });
  h+=`<button class="btn sm" id="pq-add">Add step</button>`;
  const f=document.getElementById("pqform"); f.innerHTML=h;
  document.getElementById("pq-op").onchange=ev=>{ pqForm={op:ev.target.value,p:{}}; pqFormRender(e,res); };
  const read=()=>{ f.querySelectorAll("[data-p]").forEach(x=>{ p[x.dataset.p]=x.value; }); op.params.filter(x=>x.type==="cols"||x.type==="qcols"||x.type==="ncols").forEach(pr=>{ p[pr.k]=[...f.querySelectorAll(`[data-pc="${pr.k}"]:checked`)].map(x=>x.value); }); f.querySelectorAll("[data-pk]").forEach(x=>p[x.dataset.pk]=x.checked); };
  f.querySelectorAll("[data-re],[data-p='agg']").forEach(x=>x.onchange=()=>{ read(); pqFormRender(e,res); });
  document.getElementById("pq-add").onclick=()=>{ read();
    op.params.forEach(pr=>{ if (p[pr.k]===undefined){ if (pr.type==="select") p[pr.k]=pr.options[0]; if (pr.type==="check") p[pr.k]=pr.def; } });
    const steps=pqSteps(e).slice(); steps.push({op:pqForm.op,p:JSON.parse(JSON.stringify(p))}); saved.pq[e.id]=steps; persist(); pqSel=null; pqForm={op:pqForm.op,p:{}}; pqRefresh(e,true); };
}

// ================= DAX =================
const DAX_MODEL={tables:{shipments:{name:"Shipments",cols:WBI.shCols,rows:WBI.sh},clients:{name:"Clients",cols:WBI.clCols,rows:WBI.cl}},rel:{fcol:"Client",tcol:"Client"}};
DAX.setModel(DAX_MODEL);
function daxEval(e, m){ const err=DAX.define([...e.existing, m]); if (err) return {parseErr:err.err}; return {rows:DAX.pivot(e.rows,m.name)}; }
function daxExpected(e){ if (!expCache[e.id]) expCache[e.id]=daxEval(e,e.sol).rows; return expCache[e.id]; }
const daxFmt=(v,f)=>v===null||v===undefined?"":f==="pct"?(v*100).toFixed(1)+"%":f==="r2"?v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/,/g," "):Math.round(v).toLocaleString("en-US").replace(/,/g," ");
function daxTable(rows,e,diffs,title){ const d=new Set(diffs||[]);
  let h=`<div class="gridwrap"><table class="xl"><thead><tr><th style="text-align:left;padding:4px 10px">${esc(e.rows.col)}</th><th style="text-align:right;padding:4px 10px">${esc(title||"Measure")}</th></tr></thead><tbody>`;
  rows.forEach((r,i)=>{ h+=`<tr class="${r.total?"tot":""}"><td>${esc(r.label)}</td><td class="num ${r.err?"err":""} ${d.has(i)?"diff":""}" ${r.err?`title="${esc(r.err)}"`:""}>${r.err?"Error":esc(daxFmt(r.value,e.fmt))}</td></tr>`; });
  return h+`</tbody></table></div>`; }
function daxBody(e){ const m=saved.dax[e.id]||{name:"",expr:""};
  return `<div class="meta"><span>Rows <b>${esc(e.rows.table)}[${esc(e.rows.col)}]</b></span><span>Relationship <b>Shipments[Client] ∞→1 Clients[Client]</b></span></div>
    ${e.existing.length?`<div class="measures"><h3>Existing measures</h3>${e.existing.map(x=>`<span>${esc(x.name)} = ${esc(x.expr)}</span>`).join("")}</div>`:""}
    <div class="fbars"><div class="fwrap"><div class="fbar on"><input class="short" id="dx-name" value="${esc(m.name)}" placeholder="Measure name" spellcheck="false" autocomplete="off" aria-label="Measure name"><span class="fx">=</span><input id="dx-expr" value="${esc(m.expr)}" placeholder="DAX expression" spellcheck="false" autocomplete="off" aria-label="DAX expression"></div></div></div>
    <div class="tblnote"><b>Use the model's tables.</b> Columns are <code>Shipments[Column]</code> or <code>Clients[Column]</code>; measures are <code>[Measure name]</code>. Type <code>[</code> or <code>Shipments[</code> to pick from the list.</div>
    <div class="runrow"><button class="btn" id="run">Run and check</button><button class="btn quiet" id="clear">Clear</button><span class="kbd">Type [ for measures · Table[ for columns</span></div>
    <div id="status"></div><div id="pivot"></div>`; }
function daxInit(e){
  const n=document.getElementById("dx-name"), x=document.getElementById("dx-expr");
  attachIntelli(x,{sigs:SIGS_DAX,tables:TABLES,dax:true,bareBracket:true,measures:()=>e.existing.map(m=>m.name)});
  const sv=()=>{ saved.dax[e.id]={name:n.value,expr:x.value}; persist(); };
  [n,x].forEach(el=>{ el.addEventListener("input",sv); el.addEventListener("keydown",ev=>{ if (ev.key==="Enter"){ ev.preventDefault(); daxRun(e,true); } }); });
  document.querySelectorAll("#ex [data-ins]").forEach(b=>b.onclick=()=>{ let v=x.value, s=x.selectionStart??v.length; x.value=v.slice(0,s)+b.dataset.ins+v.slice(x.selectionEnd??s); const p=s+b.dataset.ins.length; x.focus(); x.setSelectionRange(p,p); sv(); });
  document.getElementById("run").onclick=()=>daxRun(e,true);
  document.getElementById("clear").onclick=()=>{ saved.dax[e.id]={name:"",expr:""}; persist(); renderEx(); };
  if ((saved.dax[e.id]?.expr||"").trim()) daxRun(e,false); else { document.getElementById("pivot").innerHTML=daxTable(daxExpected(e).map(r=>({label:r.label,total:r.total,value:null})),e,null,"(your measure)"); setStatus({state:"info",title:`Name the measure "${e.sol.name}" and write its expression.`,msg:"The pivot recalculates your measure for every row and the total, like a PivotTable in the Data Model."}); }
}
function daxRun(e,user){
  const m=saved.dax[e.id]||{name:"",expr:""}; const name=(m.name||"").trim()||"Measure";
  if (!(m.expr||"").trim()) return setStatus({state:"info",title:"Write the DAX expression first.",msg:""});
  if (e.existing.some(x=>x.name.toLowerCase()===name.toLowerCase())) return setStatus({state:"no",title:`A measure called ${name} already exists.`,msg:"Give the new measure its own name."});
  const r=daxEval(e,{name,expr:m.expr.replace(/^\s*=/,"")});
  if (r.parseErr){ document.getElementById("pivot").innerHTML=""; return setStatus({state:"no",title:"The expression can't be read.",msg:r.parseErr}); }
  const exp=daxExpected(e), diffs=[]; let err=null;
  r.rows.forEach((x,i)=>{ if (x.err&&!err) err=x.err; const a=x.value, b=exp[i].value; const ok=(a==null&&b==null)||(a!=null&&b!=null&&Math.abs(a-b)<0.005); if (!ok) diffs.push(i); });
  document.getElementById("pivot").innerHTML=daxTable(r.rows,e,diffs,name);
  if (err) return setStatus({state:"no",title:"Your measure returns an error.",msg:err});
  if (diffs.length) return setStatus({state:"no",title:`${diffs.length} of ${exp.length} values don't match.`,msg:diffs.includes(exp.length-1)&&diffs.length===1?"Only the Total is off. Think about what the filter context is on the Total row.":"Mismatched values are outlined in red. Check your filters."});
  if (e.must&&!e.must.test(m.expr)) return setStatus({state:"no",title:"Right numbers, but use the technique this exercise practises.",msg:e.mustMsg});
  okStatus(markDone(e.id)&&user);
}

// ================= VBA =================
function vbaHL(line){ return esc(line).replace(/(&#39;|').*$/,m=>`<span class="cm">${m}</span>`).replace(/\b(Sub|End|Dim|As|String|Long|Do|While|Loop|Private|MsgBox|Debug)\b(?![^<]*<\/span>)/g,'<span class="kw">$1</span>'); }
function vbaBody(e){
  const v=saved.vba[e.id]||"";
  return `<div class="vba" id="vbacode">${e.code.map((l,i)=>{ if (!l.includes("___")) return `<div class="ln"><span class="no">${i+1}</span>${vbaHL(l)}</div>`;
    const [a,b]=l.split("___"); return `<div class="ln"><span class="no">${i+1}</span>${vbaHL(a)}<input id="vba-in" value="${esc(v)}" placeholder="type the missing code" spellcheck="false" autocomplete="off" aria-label="Missing line">${vbaHL(b)}</div>`; }).join("")}</div>
    <div class="runrow"><button class="btn" id="run">Check</button><span class="kbd">Enter checks your line</span></div>
    <div id="status"></div><div id="vbaresult"></div>`; }
function vbaInit(e){
  const inp=document.getElementById("vba-in");
  inp.addEventListener("input",()=>{ saved.vba[e.id]=inp.value; persist(); });
  inp.addEventListener("keydown",ev=>{ if (ev.key==="Enter"){ ev.preventDefault(); vbaRun(e,true); } });
  document.getElementById("run").onclick=()=>vbaRun(e,true);
  if ((saved.vba[e.id]||"").trim()) vbaRun(e,false); else setStatus({state:"info",title:"Type the missing code in the yellow box.",msg:"Just the missing part, exactly as you'd type it in the VBA editor."});
}
function vbaRun(e,user){
  const v=(saved.vba[e.id]||"").trim().replace(/\s+/g," ").replace(/\s*'.*$/,"");
  const out=document.getElementById("vbaresult"); out.innerHTML="";
  if (!v) return setStatus({state:"info",title:"Type the missing code first.",msg:""});
  if (e.accept.some(re=>re.test(v))){ okStatus(markDone(e.id)&&user); out.innerHTML=`<p class="note"><b>What happens when it runs.</b> ${esc(e.result)}</p>`; return; }
  const w=e.wrong.find(([re])=>re.test(v));
  setStatus({state:"no",title:"Not quite.",msg:w?w[1]:"Check the object, the property or method name, and the spelling. A hint can help."});
}

// ---------- data card & nav ----------
function renderTables(){
  const sh=WBI.sh.map(r=>[r[0],fmtDate(r[1]),...r.slice(2)]);
  document.getElementById("tables").innerHTML=`<div><p class="small" style="margin:0 0 6px">Shipments · ${sh.length} rows in date order · refer to columns like <code>Shipments[Branch]</code></p>${miniTable(WBI.shCols,sh,1,1)}</div>
     <div><p class="small" style="margin:0 0 6px">Clients · one row per client</p>${miniTable(WBI.clCols,WBI.cl,10,1)}</div>`;
}
let curNote=null;
const inl=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>");
function noteBlock(b){
  if (b.p) return `<p class="np">${inl(b.p)}</p>`;
  if (b.code) return `<pre class="ncode">${esc(b.code)}</pre>`;
  if (b.list) return `<ul class="nlist">${b.list.map(x=>`<li>${inl(x)}</li>`).join("")}</ul>`;
  if (b.tbl) return `<div class="ntblw"><table class="ntbl"><tbody>${b.tbl.map(([k,v])=>`<tr><th><code>${esc(k)}</code></th><td>${inl(v)}</td></tr>`).join("")}</tbody></table></div>`;
  if (b.tip) return `<p class="ntip"><b>Tip.</b> ${inl(b.tip)}</p>`;
  if (b.warn) return `<p class="nwarn"><b>Watch out.</b> ${inl(b.warn)}</p>`;
  return "";
}
function openNote(g){
  if (!NOTES[g]) return; curNote=g; renderNav();
  const N=NOTES[g], es=EXS.filter(e=>e.group===g), gi=ORDER.findIndex(([x])=>x===g);
  document.getElementById("ex").innerHTML=`
    <div class="exhead"><div><h3>Training notes · topic ${gi+1} of ${ORDER.length}</h3><h2 style="margin-top:4px">${esc(g)}</h2></div></div>
    <p class="task">${esc(N.lead)}</p>
    <nav class="ntoc" aria-label="On this page">${N.sec.map((s,i)=>`<a href="#n${i}" data-sec="${i}">${esc(s.h)}</a>`).join("")}</nav>
    ${N.sec.map((s,i)=>`<section class="nsec" id="nsec${i}"><h3 class="nh">${esc(s.h)}</h3>${s.b.map(noteBlock).join("")}</section>`).join("")}
    <section class="nsec"><h3 class="nh">Practise this topic</h3><div class="npract">${es.map(e=>`<button class="nex" data-go="${e.id}"><span class="no">${e.num}</span><span>${esc(e.title)}</span>${done.has(e.id)?'<span class="tick">✓</span>':""}</button>`).join("")}</div></section>
    <div class="foot">${gi>0?`<button class="btn quiet" data-note-go="${esc(ORDER[gi-1][0])}">← ${esc(ORDER[gi-1][0])} notes</button>`:"<span></span>"}<button class="btn" data-go="${es[0].id}">Start the exercises</button></div>`;
  document.querySelectorAll("#ex [data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll("#ex [data-note-go]").forEach(b=>b.onclick=()=>openNote(b.dataset.noteGo));
  document.querySelectorAll("#ex .ntoc a").forEach(a=>a.onclick=ev=>{ ev.preventDefault(); document.getElementById("nsec"+a.dataset.sec).scrollIntoView({behavior:"smooth",block:"start"}); });
  document.getElementById("datacard").hidden=false; window.scrollTo({top:0});
}
function go(id){ if (!byId[id]) return; curNote=null; cur=id; shown={hints:0,exp:false,sol:false}; activeCell=null; pqSel=null; pqForm={op:"skip",p:{}};
  renderNav(); renderEx(); window.scrollTo({top:0}); }
document.getElementById("pick").onchange=ev=>{ const v=ev.target.value; if (v.startsWith("note:")) openNote(v.slice(5)); else go(v); };
renderNav(); renderTables(); renderEx();
</script>
