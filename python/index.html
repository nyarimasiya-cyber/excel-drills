<style>
/* Layout: a lab workbook. Sticky module index on the left, one module at a time on the right;
   lessons read like notebook cells (code in, output out), drills sit in their own band below. */
:root {
  --paper: #f3f6f3;
  --surface: #ffffff;
  --ink: #17201d;
  --muted: #5a6761;
  --line: #d7dcd3;
  --accent: #1d6b45;
  --accent-ink: #ffffff;
  --accent-soft: #e6f1ea;
  --xl: #8a5a12;
  --xl-soft: #f6eedf;
  --good: #2b7a4b;
  --good-soft: #e2f1e7;
  --bad: #b2412d;
  --bad-soft: #f8e6e1;
  --code-bg: #1b2320;
  --code-fg: #e3ebe7;
  --code-dim: #8fa39a;
  --tk-kw: #f0b46a;
  --tk-str: #a8d68f;
  --tk-num: #8fc8f0;
  --tk-fn: #e6a3c9;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1511; --surface: #171f1c; --ink: #e2e9e5; --muted: #98a59e; --line: #2a3430;
    --accent: #55c28a; --accent-ink: #0d1a15; --accent-soft: #1c2d27;
    --xl: #e2ad5c; --xl-soft: #2a2317; --good: #6fcd95; --good-soft: #17291f;
    --bad: #ef8b74; --bad-soft: #2f1c18; --code-bg: #0b0f0e; --code-fg: #e3ebe7; --code-dim: #7f948b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1511; --surface: #171f1c; --ink: #e2e9e5; --muted: #98a59e; --line: #2a3430;
  --accent: #55c28a; --accent-ink: #0d1a15; --accent-soft: #1c2d27;
  --xl: #e2ad5c; --xl-soft: #2a2317; --good: #6fcd95; --good-soft: #17291f;
  --bad: #ef8b74; --bad-soft: #2f1c18; --code-bg: #0b0f0e; --code-fg: #e3ebe7; --code-dim: #7f948b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
.page > *, .lesson > *, .drill > *, .drills > *, .lessons > *, section > *, header > * { min-width: 0; }
.opts.prose pre { font-family: var(--body); font-size: 0.95rem; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55; }
code, pre { font-family: var(--mono); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.shell { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px));
  overflow-y: auto; border-right: 1px solid var(--line); background: var(--surface);
  padding-block: 24px 32px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: 20px;
  display: flex; flex-direction: column; gap: 20px;
}
.brand { font-family: var(--display); font-weight: 700; font-size: 1.35rem; line-height: 1.1; letter-spacing: -0.01em; text-decoration: none; color: var(--ink); }
.brand small { display: block; font-family: var(--mono); font-weight: 400; font-size: 0.72rem; color: var(--muted); letter-spacing: 0.04em; margin-top: 6px; }
.meter { display: grid; gap: 6px; font-size: 0.85rem; color: var(--muted); }
.meter-bar { height: 6px; border-radius: 3px; background: var(--accent-soft); overflow: hidden; }
.meter-bar span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.nav { display: grid; gap: 14px; }
.nav h4 { margin: 0 0 4px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; }
.nav a {
  display: grid; grid-template-columns: 1.8em 1fr auto; align-items: baseline; gap: 6px;
  padding: 6px 8px; border-radius: 6px; text-decoration: none; color: var(--ink); font-size: 0.95rem; line-height: 1.3;
}
.nav a:hover { background: var(--accent-soft); }
.nav a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.nav a .n { font-family: var(--mono); font-size: 0.75rem; opacity: .7; }
.nav a .c { font-family: var(--mono); font-size: 0.72rem; opacity: .75; font-variant-numeric: tabular-nums; }
.nav a.done .c::before { content: "✓ "; }
.theme-row { margin-top: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.theme-row button { font: inherit; font-size: 0.8rem; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.theme-row button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }

.mobile-top { display: none; }
main { padding-block: 40px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0; }
.page { max-width: 780px; margin: 0 auto; display: grid; gap: 40px; }

.eyebrow { font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(2rem, 5vw, 2.9rem); line-height: 1.05; letter-spacing: -0.02em; margin: 8px 0 12px; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 600; font-size: 1.5rem; letter-spacing: -0.01em; margin: 0 0 14px; text-wrap: balance; }
h3 { font-family: var(--display); font-weight: 600; font-size: 1.15rem; margin: 0; text-wrap: balance; }
.lede { font-size: 1.15rem; color: var(--muted); max-width: 62ch; margin: 0; }
p { margin: 0; max-width: 66ch; }
p code, li code, td code.inl, .q code { background: var(--accent-soft); color: var(--ink); padding: 1px 5px; border-radius: 4px; font-size: 0.86em; }

/* Excel ↔ Python */
.xmap { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow-x: auto; }
.xmap table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.xmap th { text-align: left; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 600; }
.xmap td { padding: 8px 14px; border-bottom: 1px solid var(--line); vertical-align: top; font-family: var(--mono); font-size: 0.82rem; }
.xmap tr:last-child td { border-bottom: 0; }
.xmap td:first-child { color: var(--xl); background: var(--xl-soft); width: 44%; }
.xmap td:last-child { color: var(--accent); }

/* lessons as notebook cells */
.lessons { display: grid; gap: 34px; }
.lesson { display: grid; gap: 12px; }
.lesson-head { display: flex; gap: 10px; align-items: baseline; }
.lesson-head .k { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cell { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
.cell-code { position: relative; background: var(--code-bg); color: var(--code-fg); }
.cell-code pre { margin: 0; padding: 16px 18px; overflow-x: auto; font-size: 0.85rem; line-height: 1.6; tab-size: 4; }
.cell-tag { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
.copy { font: 600 0.72rem var(--mono); color: var(--code-dim); background: transparent; border: 1px solid #ffffff22; border-radius: 5px; padding: 3px 8px; cursor: pointer; }
.copy:hover { color: var(--code-fg); border-color: #ffffff55; }
.cell-out { background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: 3.2em minmax(0, 1fr); }
.cell-out .lbl { font: 600 0.72rem var(--mono); color: var(--muted); padding: 12px 0 0 14px; }
.cell-out pre { margin: 0; padding: 12px 18px 12px 0; overflow-x: auto; font-size: 0.82rem; line-height: 1.5; color: var(--ink); }
.cell-out .imgs { padding: 12px 14px 12px 0; display: grid; gap: 10px; min-width: 0; }
.cell-out img { background: #fff; border-radius: 6px; display: block; max-width: 100%; height: auto; }
.cell-note { background: var(--surface); border-top: 1px solid var(--line); padding: 8px 14px; font-size: 0.82rem; color: var(--muted); font-style: italic; }
.tk-c { color: var(--code-dim); font-style: italic; }
.tk-k { color: var(--tk-kw); }
.tk-s { color: var(--tk-str); }
.tk-n { color: var(--tk-num); }
.tk-f { color: var(--tk-fn); }

/* drills */
.drills { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 26px 24px; display: grid; gap: 22px; }
.drills-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.drills-head h2 { margin: 0; }
.score { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.drill { border-top: 1px solid var(--line); padding-top: 20px; display: grid; gap: 12px; }
.drill:first-of-type { border-top: 0; padding-top: 0; }
.drill .q { display: flex; gap: 10px; font-weight: 600; }
.drill .q .num { font-family: var(--mono); font-weight: 600; font-size: 0.8rem; color: var(--accent); padding-top: 3px; min-width: 2.2em; }
.kind { font: 600 0.68rem var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.opts.long { grid-template-columns: 1fr; }
.opt {
  text-align: left; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 12px; cursor: pointer; display: grid; grid-template-columns: 1.6em minmax(0, 1fr); gap: 6px; align-items: baseline;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt .l { font: 600 0.75rem var(--mono); color: var(--muted); }
.opt pre { margin: 0; font-size: 0.85rem; white-space: pre-wrap; word-break: break-word; }
.opt.right { background: var(--good-soft); border-color: var(--good); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.fb { border-radius: 8px; padding: 10px 14px; font-size: 0.95rem; }
.fb.ok { background: var(--good-soft); }
.fb.no { background: var(--bad-soft); }
.fb b { color: var(--good); }
.fb.no b { color: var(--bad); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { font: 600 0.88rem var(--body); border-radius: 8px; padding: 7px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.on { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.hint { background: var(--xl-soft); border-radius: 8px; padding: 10px 14px; font-size: 0.95rem; }
.hint b { color: var(--xl); }

.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.pager a { text-decoration: none; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; background: var(--surface); display: grid; gap: 2px; min-width: 0; max-width: 100%; }
.pager a:hover { border-color: var(--accent); }
.pager a span { font-size: 0.75rem; color: var(--muted); font-family: var(--mono); }
.pager a.next { margin-left: auto; text-align: right; }
.reset { font: inherit; font-size: 0.85rem; color: var(--muted); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 0; }

/* overview */
.howto { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.howto div { border-top: 2px solid var(--accent); padding-top: 10px; display: grid; gap: 4px; font-size: 0.95rem; }
.howto b { font-family: var(--display); font-weight: 600; font-size: 1.05rem; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mcard { display: grid; gap: 6px; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.mcard:hover { border-color: var(--accent); }
.mcard .top { display: flex; justify-content: space-between; gap: 8px; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }
.mcard h3 { font-size: 1.05rem; }
.mcard p { font-size: 0.9rem; color: var(--muted); }
.mcard .bar { height: 4px; background: var(--accent-soft); border-radius: 2px; overflow: hidden; }
.mcard .bar span { display: block; height: 100%; background: var(--accent); }

@media (max-width: 880px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .mobile-top {
    display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface);
    border-bottom: 1px solid var(--line); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    gap: 10px; align-items: center;
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
  .mobile-top .brand { font-size: 1rem; white-space: nowrap; }
  .mobile-top select { flex: 1; min-width: 0; font: inherit; font-size: 0.9rem; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
  main { padding-block: 24px 60px; }
  .howto { grid-template-columns: 1fr; }
  .grid { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
  .opts { grid-template-columns: 1fr; }
  .drills { padding: 20px 16px; }
  .xmap td:first-child { width: 46%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.tracks{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;font-size:.85rem;width:max-content}.tracks a{padding:4px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600}.tracks a:hover{color:var(--ink)}.tracks a[aria-current]{background:var(--accent);color:var(--accent-ink)}
.howto a{color:var(--accent);font-weight:600}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>

<script>
const DATA = {"setup":"import numpy as np\nimport pandas as pd\n\nsales = pd.DataFrame({\n    \"order_id\":   [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012],\n    \"date\":       [\"2026-01-05\", \"2026-01-12\", \"2026-01-19\", \"2026-02-02\", \"2026-02-09\", \"2026-02-16\",\n                   \"2026-03-02\", \"2026-03-09\", \"2026-03-16\", \"2026-03-23\", \"2026-03-30\", \"2026-04-06\"],\n    \"branch\":     [\"Cape Town\", \"Johannesburg\", \"Durban\", \"Cape Town\", \"Johannesburg\", \"Durban\",\n                   \"Cape Town\", \"Johannesburg\", \"Durban\", \"Cape Town\", \"Johannesburg\", \"Durban\"],\n    \"product\":    [\"A4 Paper\", \"Pens\", \"Stapler\", \"Pens\", \"A4 Paper\", \"Notebooks\",\n                   \"Stapler\", \"Notebooks\", \"A4 Paper\", \"Notebooks\", \"Pens\", \"Pens\"],\n    \"category\":   [\"Paper\", \"Writing\", \"Office\", \"Writing\", \"Paper\", \"Paper\",\n                   \"Office\", \"Paper\", \"Paper\", \"Paper\", \"Writing\", \"Writing\"],\n    \"qty\":        [20, 150, 5, 200, 35, 60, 8, None, 25, 40, 120, 90],\n    \"unit_price\": [89.0, 4.5, 145.0, 4.5, 89.0, 22.0, 145.0, 22.0, 89.0, 22.0, 4.5, 4.5],\n})","modules":[{"id":"start","stage":"Python basics","title":"Getting started","summary":"Where Python runs, how a notebook works, and Python as a calculator.","excel":[["=2+3","2 + 3"],["=7/2","7 / 2"],["=INT(7/2)","7 // 2"],["=MOD(7,2)","7 % 2"],["=2^3","2 ** 3"],["=ROUND(A1,2)","round(a1, 2)"]],"lessons":[{"h":"Where to run it","text":"Open Google Colab (colab.research.google.com) and choose New notebook. Nothing to install, and NumPy, pandas and matplotlib are already there. A notebook is a stack of cells. Type code in a cell and press Shift+Enter to run it. The companion notebook for this course opens straight in Colab.","code":"print(\"Hello, analyst\")\nprint(2 + 3)","out":"Hello, analyst\n5","img":[]},{"h":"Comments and running order","text":"Python runs top to bottom. Anything after `#` is a comment for humans and is ignored. In a notebook, a cell only knows what earlier cells have already run.","code":"# Monthly sales target in rand\nmonthly_target = 50000\nprint(monthly_target)","out":"50000","img":[]},{"h":"Python as a calculator","text":"`/` always gives a decimal. `//` is whole-number division, `%` is the remainder (Excel MOD) and `**` is a power.","code":"print(7 / 2)\nprint(7 // 2)\nprint(7 % 2)\nprint(2 ** 3)\nprint(round(1234.5678, 2))","out":"3.5\n3\n1\n8\n1234.57","img":[]}],"drills":[{"t":"mcq","q":"What prints?","code":"print(10 / 4)","opts":["2","2.5","2.0","Error"],"a":1,"run":true,"why":"Single slash is normal division and always returns a decimal (float)."},{"t":"mcq","q":"What prints?","code":"print(10 // 4)","opts":["2.5","2","3","2.0"],"a":1,"run":true,"why":"Double slash drops the decimal part, like Excel INT(10/4)."},{"t":"mcq","q":"What prints?","code":"print(17 % 5)","opts":["2","3","3.4","12"],"a":0,"run":true,"why":"% gives the remainder: 17 = 3 x 5 + 2. Same as =MOD(17,5)."},{"t":"mcq","q":"What prints?","code":"print(round(2 ** 10 / 3, 1))","opts":["341.3","341.33","6.7","341"],"a":0,"run":true,"why":"2 ** 10 is 1024, divided by 3 is 341.333..., rounded to 1 decimal is 341.3."},{"t":"mcq","q":"What does Python do with a line that starts with #?","code":"","opts":["Prints it in bold","Treats it as a heading","Ignores it","Raises an error"],"a":2,"why":"# starts a comment. Use comments to explain why a step exists."},{"t":"write","q":"An invoice is R2,400 before VAT. Calculate 15% VAT and print the total including VAT.","hint":"Store the price in a variable first, then multiply by 0.15.","sol":"price = 2400\nvat = price * 0.15\nprint(price + vat)","out":"2760.0","img":[]}]},{"id":"variables","stage":"Python basics","title":"Variables and data types","summary":"Naming values, the four core types, and converting numbers stored as text.","excel":[["Cell reference B2","a named variable, e.g. invoice_total"],["ISTEXT / ISNUMBER","type(x)"],["=VALUE(\"25\")","int(\"25\") or float(\"25\")"],["=TEXT(25,\"0\")","str(25)"],["TRUE / FALSE","True / False"],["Blank cell","None (NaN in pandas)"]],"lessons":[{"h":"Variables are named boxes","text":"Write `name = value`. Use lowercase words joined by underscores. Names cannot contain spaces or dashes and cannot start with a digit.","code":"client = \"Acme Traders\"\ninvoice_total = 12500.75\nunits = 40\nis_paid = False\nprint(client, invoice_total, units, is_paid)","out":"Acme Traders 12500.75 40 False","img":[]},{"h":"The four core types","text":"`str` is text, `int` a whole number, `float` a decimal and `bool` is True or False. `type()` tells you which one you have.","code":"print(type(client))\nprint(type(units))\nprint(type(invoice_total))\nprint(type(is_paid))","out":"<class 'str'>\n<class 'int'>\n<class 'float'>\n<class 'bool'>","img":[]},{"h":"Converting types","text":"Data from Excel or CSV often arrives as text. Text times 2 repeats the text. Convert first with `int()`, `float()` or `str()`.","code":"qty_text = \"25\"\nprint(qty_text * 2)\nqty = int(qty_text)\nprint(qty * 2)\nprint(float(\"89.90\") + 10)","out":"2525\n50\n99.9","img":[]},{"h":"Updating a variable","text":"`units += 5` is shorthand for `units = units + 5`. The same works with `-=`, `*=` and `/=`.","code":"units = 40\nunits = units + 10\nunits += 5\nprint(units)","out":"55","img":[]}],"drills":[{"t":"mcq","q":"What prints?","code":"x = \"5\"\nprint(x * 3)","opts":["15","555","Error","5 5 5"],"a":1,"run":true,"why":"x is text, so * 3 repeats it. Convert with int(x) first if you want 15."},{"t":"mcq","q":"What prints?","code":"print(type(3.0))","opts":["<class 'int'>","<class 'float'>","<class 'str'>","<class 'bool'>"],"a":1,"run":true,"why":"Any number with a decimal point is a float, even 3.0."},{"t":"mcq","q":"What prints?","code":"total = 100\ntotal += 50\ntotal = total * 2\nprint(total)","opts":["200","250","300","150"],"a":2,"run":true,"why":"100 + 50 = 150, then 150 x 2 = 300."},{"t":"mcq","q":"Which is a valid variable name?","code":"","opts":["2026_sales","sales 2026","sales_2026","sales-2026"],"a":2,"why":"Names can't start with a digit, contain spaces, or contain dashes."},{"t":"mcq","q":"What prints?","code":"print(int(9.99))","opts":["10","9","9.99","Error"],"a":1,"run":true,"why":"int() chops off the decimals. Use round(9.99) to round to 10."},{"t":"write","q":"You import qty = '12' and price = '45.50' as text. Convert them and print the line value.","hint":"Whole numbers use int(), decimals use float().","sol":"qty = int(\"12\")\nprice = float(\"45.50\")\nprint(qty * price)","out":"546.0","img":[]}]},{"id":"strings","stage":"Python basics","title":"Strings","summary":"Joining, formatting, cleaning, slicing and splitting text.","excel":[["=A1&\" \"&B1","a + \" \" + b  or  f\"{a} {b}\""],["=LEN(A1)","len(s)"],["=TRIM(A1)","s.strip()  (ends only)"],["=UPPER / LOWER / PROPER","s.upper() / s.lower() / s.title()"],["=SUBSTITUTE(A1,\"R\",\"\")","s.replace(\"R\", \"\")"],["=LEFT(A1,3)","s[:3]"],["=RIGHT(A1,4)","s[-4:]"],["=MID(A1,5,4)","s[4:8]"],["=TEXTSPLIT(A1,\";\")","s.split(\";\")"],["=TEXT(A1,\"#,##0.00\")","f\"{a1:,.2f}\""],["=ISNUMBER(SEARCH(\"x\",A1))","\"x\" in s  (case-sensitive)"]],"lessons":[{"h":"Joining and length","text":"Text goes in quotes. `+` joins strings and `len()` counts characters, spaces included.","code":"first = \"Thandi\"\nlast = \"Nkosi\"\nfull = first + \" \" + last\nprint(full)\nprint(len(full))","out":"Thandi Nkosi\n12","img":[]},{"h":"f-strings: formatting for reports","text":"Put `f` before the quote and variables inside `{}`. After a colon you add a format: `,.2f` gives thousands separators and 2 decimals, `.1%` gives a percentage.","code":"client = \"Acme Traders\"\ntotal = 12500.756\nprint(f\"Invoice for {client}: R{total:,.2f}\")\nprint(f\"Growth: {0.0834:.1%}\")","out":"Invoice for Acme Traders: R12,500.76\nGrowth: 8.3%","img":[]},{"h":"Cleaning text","text":"Methods can be chained left to right. This is the Python version of nesting TRIM inside PROPER.","code":"raw = \"  cape TOWN  \"\nprint(raw.strip().title())\namount = \"R1 250,00\"\nprint(amount.replace(\"R\", \"\").replace(\" \", \"\").replace(\",\", \".\"))","out":"Cape Town\n1250.00","img":[]},{"h":"Indexing and slicing","text":"Positions start at 0. `s[a:b]` takes from position a up to, but not including, b. Negative numbers count from the end.","code":"code = \"INV-2026-0042\"\nprint(code[0])\nprint(code[:3])\nprint(code[4:8])\nprint(code[-4:])","out":"I\nINV\n2026\n0042","img":[]},{"h":"Splitting and searching","text":"`split()` breaks text into a list. `in` checks whether text contains something.","code":"line = \"Cape Town;A4 Paper;20\"\nparts = line.split(\";\")\nprint(parts)\nprint(parts[1])\nprint(\"Paper\" in line)","out":"['Cape Town', 'A4 Paper', '20']\nA4 Paper\nTrue","img":[]}],"drills":[{"t":"mcq","q":"What prints?","code":"s = \"Johannesburg\"\nprint(s[:4])","opts":["Johan","Joha","ohan","J"],"a":1,"run":true,"why":"[:4] takes positions 0, 1, 2 and 3. The end position is excluded."},{"t":"mcq","q":"What prints?","code":"s = \"INV-0042\"\nprint(s[-2:])","opts":["42","0042","INV","4"],"a":0,"run":true,"why":"[-2:] means from the second-last character to the end, like RIGHT(s,2)."},{"t":"mcq","q":"What prints?","code":"print(\"  pens \".strip().upper())","opts":["Pens","PENS","pens","Error"],"a":1,"run":true,"why":"strip() removes the outer spaces, then upper() capitalises."},{"t":"mcq","q":"What prints?","code":"amount = 1234.5\nprint(f\"R{amount:,.2f}\")","opts":["R1234.5","R1,234.50","R1 234,50","R1,234.5"],"a":1,"run":true,"why":",.2f adds a comma thousands separator and exactly 2 decimals."},{"t":"mcq","q":"What prints?","code":"print(\"a,b,c\".split(\",\"))","opts":["abc","['a', 'b', 'c']","('a', 'b', 'c')","a b c"],"a":1,"run":true,"why":"split() always returns a list."},{"t":"mcq","q":"What prints?","code":"print(len(\"R 100\"))","opts":["4","5","3","100"],"a":1,"run":true,"why":"The space counts as a character: R, space, 1, 0, 0."},{"t":"write","q":"Given ref = 'za-cpt-00917', print 'CPT' in capitals, then print the number part as the integer 917.","hint":"split('-') gives three parts. int() drops leading zeros.","sol":"ref = \"za-cpt-00917\"\nparts = ref.split(\"-\")\nprint(parts[1].upper())\nprint(int(parts[2]))","out":"CPT\n917","img":[]}]},{"id":"collections","stage":"Python basics","title":"Lists and dictionaries","summary":"Holding many values: lists for columns, dictionaries for lookups, sets for unique values.","excel":[["A column of values","a list: [42000, 38500, ...]"],["=COUNTA(A:A)","len(lst)"],["=SUM / MAX / MIN","sum(lst) / max(lst) / min(lst)"],["=SORT(A2:A9,,-1)","sorted(lst, reverse=True)"],["=INDEX(A2:A9,1)","lst[0]"],["XLOOKUP on a 2-column table","d[key]"],["=IFERROR(XLOOKUP(...),0)","d.get(key, 0)"],["=UNIQUE(A2:A9)","sorted(set(lst))"]],"lessons":[{"h":"Lists","text":"A list holds values in order inside square brackets. It behaves much like a single Excel column.","code":"monthly = [42000, 38500, 51200, 47800]\nmonthly.append(53900)\nprint(monthly)\nprint(monthly[0], monthly[-1])\nprint(len(monthly), sum(monthly), max(monthly))\nprint(sorted(monthly, reverse=True))\nprint(monthly[1:3])","out":"[42000, 38500, 51200, 47800, 53900]\n42000 53900\n5 233400 53900\n[53900, 51200, 47800, 42000, 38500]\n[38500, 51200]","img":[]},{"h":"Dictionaries: built-in lookups","text":"A dictionary maps keys to values, like a two-column lookup table. `d[key]` fails if the key is missing; `d.get(key, default)` returns a fallback instead.","code":"prices = {\"A4 Paper\": 89.0, \"Pens\": 4.5, \"Stapler\": 145.0}\nprint(prices[\"Pens\"])\nprices[\"Notebooks\"] = 22.0\nprint(prices.get(\"Tape\", 0))\nprint(list(prices.keys()))","out":"4.5\n0\n['A4 Paper', 'Pens', 'Stapler', 'Notebooks']","img":[]},{"h":"A record is a dictionary","text":"One row of data fits naturally in a dictionary. A list of these dictionaries is a table, which is exactly what pandas will make easier.","code":"order = {\"branch\": \"Durban\", \"product\": \"Pens\", \"qty\": 90}\nprint(order[\"qty\"] * prices[order[\"product\"]])","out":"405.0","img":[]},{"h":"Sets for unique values","text":"A set keeps each value once and has no order. Wrap it in `sorted()` for a tidy list.","code":"branches = [\"Durban\", \"Cape Town\", \"Durban\", \"Johannesburg\", \"Cape Town\"]\nprint(sorted(set(branches)))\nprint(len(set(branches)))","out":"['Cape Town', 'Durban', 'Johannesburg']\n3","img":[]}],"drills":[{"t":"mcq","q":"What prints?","code":"nums = [5, 10, 15, 20]\nprint(nums[1])","opts":["5","10","15","Error"],"a":1,"run":true,"why":"Counting starts at 0, so position 1 is the second item."},{"t":"mcq","q":"What prints?","code":"nums = [5, 10, 15, 20]\nprint(nums[-1] + nums[0])","opts":["15","25","30","20"],"a":1,"run":true,"why":"Last item (20) plus first item (5)."},{"t":"mcq","q":"What prints?","code":"nums = [3, 1, 2]\nnums.append(5)\nprint(len(nums))","opts":["3","4","5","11"],"a":1,"run":true,"why":"append adds one item, so the list now has 4."},{"t":"mcq","q":"What prints?","code":"d = {\"CPT\": 120, \"JHB\": 200}\nprint(d.get(\"DBN\", 0))","opts":["None","Error","0","DBN"],"a":2,"run":true,"why":"DBN isn't a key, so get() returns the fallback 0. d['DBN'] would raise KeyError."},{"t":"mcq","q":"What prints?","code":"print(len(set([1, 1, 2, 3, 3, 3])))","opts":["6","3","2","1"],"a":1,"run":true,"why":"The set keeps 1, 2 and 3 once each."},{"t":"write","q":"Store rep targets {'Sipho': 50000, 'Anele': 65000, 'Kim': 40000}. Print the total target, then the name with the highest target.","hint":"sum(d.values()) adds the values. max(d, key=d.get) returns the key with the largest value.","sol":"targets = {\"Sipho\": 50000, \"Anele\": 65000, \"Kim\": 40000}\nprint(sum(targets.values()))\nprint(max(targets, key=targets.get))","out":"155000\nAnele","img":[]}]},{"id":"conditions","stage":"Python basics","title":"Conditions","summary":"Making decisions with if, elif and else.","excel":[["=IF(A1>=50000,\"Hit\",\"Miss\")","\"Hit\" if a >= 50000 else \"Miss\""],["Nested IF / IFS","if / elif / else"],["=AND(a,b) / =OR(a,b) / =NOT(a)","a and b / a or b / not a"],["A1=B1 (compare)","a == b"],["A1<>B1","a != b"]],"lessons":[{"h":"Comparisons give True or False","text":"`==` compares, a single `=` assigns. Text comparisons are case-sensitive.","code":"qty = 120\nprint(qty > 100)\nprint(qty == 100)\nprint(\"Pens\" != \"pens\")","out":"True\nFalse\nTrue","img":[]},{"h":"if / elif / else","text":"Python checks each condition in order and runs the first block that is True. The colon and the 4-space indent are required: indentation is how Python knows what belongs to the if.","code":"revenue = 48000\nif revenue >= 50000:\n    status = \"On target\"\nelif revenue >= 40000:\n    status = \"Close\"\nelse:\n    status = \"Behind\"\nprint(status)","out":"Close","img":[]},{"h":"Combining with and / or","text":"`and` needs both sides True. `or` needs at least one.","code":"branch = \"Durban\"\nqty = 150\nif branch == \"Durban\" and qty > 100:\n    print(\"Bulk Durban order\")\nif branch == \"Cape Town\" or qty > 100:\n    print(\"Flag for review\")","out":"Bulk Durban order\nFlag for review","img":[]},{"h":"One-line IF","text":"For simple two-way choices, the inline form reads like Excel's IF.","code":"discount = 0.1 if qty >= 100 else 0\nprint(discount)","out":"0.1","img":[]}],"drills":[{"t":"mcq","q":"What prints?","code":"x = 75\nif x > 80:\n    print(\"A\")\nelif x > 70:\n    print(\"B\")\nelse:\n    print(\"C\")","opts":["A","B","C","B and C"],"a":1,"run":true,"why":"75 fails > 80, passes > 70, and Python stops at the first True branch."},{"t":"mcq","q":"What prints?","code":"print(5 > 3 and 2 > 4)","opts":["True","False","Error","None"],"a":1,"run":true,"why":"and needs both sides True. 2 > 4 is False."},{"t":"mcq","q":"What prints?","code":"print(not (10 == 10))","opts":["True","False","10","Error"],"a":1,"run":true,"why":"10 == 10 is True, and not flips it."},{"t":"mcq","q":"What prints?","code":"qty = 40\nrate = 0.05 if qty >= 50 else 0.02\nprint(rate)","opts":["0.05","0.02","40","Error"],"a":1,"run":true,"why":"40 is below 50, so the else value is used."},{"t":"mcq","q":"Which line checks whether x equals 5?","code":"","opts":["x = 5","x == 5","x := 5","x === 5"],"a":1,"why":"Double equals compares. Single equals stores a value."},{"t":"write","q":"Write an ageing bucket for days_overdue: 0 \u2192 'Current', 1\u201330 \u2192 '30 days', 31\u201360 \u2192 '60 days', over 60 \u2192 '60+ days'. Test it with 45.","hint":"Check from the smallest bucket up with if / elif.","sol":"days_overdue = 45\nif days_overdue == 0:\n    bucket = \"Current\"\nelif days_overdue <= 30:\n    bucket = \"30 days\"\nelif days_overdue <= 60:\n    bucket = \"60 days\"\nelse:\n    bucket = \"60+ days\"\nprint(bucket)","out":"60 days","img":[]}]},{"id":"loops","stage":"Python basics","title":"Loops","summary":"Repeating work with for and while, and the compact list comprehension.","excel":[["Drag a formula down a column","for item in lst:"],["Running-total helper column","total += value inside a loop"],["=COUNTIF(A:A,\">=100\")","loop with if and a counter"],["=FILTER(A2:A9,A2:A9>45000)","[x for x in lst if x > 45000]"],["=SEQUENCE(3)","range(1, 4)"]],"lessons":[{"h":"for loops","text":"A for loop runs its indented block once for each item. The variable after `for` holds the current item.","code":"branches = [\"Cape Town\", \"Johannesburg\", \"Durban\"]\nfor b in branches:\n    print(b.upper())","out":"CAPE TOWN\nJOHANNESBURG\nDURBAN","img":[]},{"h":"Accumulating a total","text":"Start a variable at 0 before the loop and add to it inside.","code":"sales = [42000, 38500, 51200, 47800]\ntotal = 0\nfor s in sales:\n    total += s\nprint(total)","out":"179500","img":[]},{"h":"range()","text":"`range(start, stop)` counts from start up to, but not including, stop.","code":"for month in range(1, 4):\n    print(f\"Month {month}\")","out":"Month 1\nMonth 2\nMonth 3","img":[]},{"h":"Loop plus if","text":"Combine a loop with a condition to filter or count.","code":"big = []\nfor s in sales:\n    if s > 45000:\n        big.append(s)\nprint(big)\nprint(len(big))","out":"[51200, 47800]\n2","img":[]},{"h":"Looping over a dictionary","text":"`.items()` gives you each key and value together.","code":"stock = {\"A4 Paper\": 12, \"Pens\": 340, \"Stapler\": 3}\nfor item, units in stock.items():\n    if units < 10:\n        print(f\"Reorder {item}: only {units} left\")","out":"Reorder Stapler: only 3 left","img":[]},{"h":"while loops","text":"A while loop repeats until its condition turns False. Make sure something inside the loop moves it toward False.","code":"balance = 10000\nmonths = 0\nwhile balance > 0:\n    balance -= 2500\n    months += 1\nprint(months)","out":"4","img":[]},{"h":"List comprehensions","text":"A one-line loop that builds a new list. In pandas you will rarely loop at all, because whole columns are calculated at once.","code":"with_vat = [round(s * 1.15) for s in sales]\nprint(with_vat)\nprint([s for s in sales if s > 45000])","out":"[48300, 44275, 58880, 54970]\n[51200, 47800]","img":[]}],"drills":[{"t":"mcq","q":"What prints?","code":"total = 0\nfor n in [2, 4, 6]:\n    total += n\nprint(total)","opts":["6","12","246","0"],"a":1,"run":true,"why":"0 + 2 + 4 + 6 = 12. The print is outside the loop, so it runs once."},{"t":"mcq","q":"What prints?","code":"for i in range(3):\n    print(i)","opts":["1\n2\n3","0\n1\n2","0\n1\n2\n3","3"],"a":1,"run":true,"why":"range(3) starts at 0 and stops before 3."},{"t":"mcq","q":"What prints?","code":"print([x * 2 for x in [1, 2, 3]])","opts":["[1, 2, 3, 1, 2, 3]","[2, 4, 6]","12","[1, 2, 3]"],"a":1,"run":true,"why":"Each item is doubled into a new list."},{"t":"mcq","q":"What prints?","code":"count = 0\nfor q in [5, 120, 80, 300]:\n    if q >= 100:\n        count += 1\nprint(count)","opts":["1","2","3","4"],"a":1,"run":true,"why":"Only 120 and 300 are 100 or more."},{"t":"mcq","q":"What prints?","code":"print(list(range(2, 10, 3)))","opts":["[2, 5, 8]","[2, 5, 8, 11]","[3, 6, 9]","[2, 3, 4]"],"a":0,"run":true,"why":"Start at 2, step 3, stop before 10."},{"t":"write","q":"Given invoices = [1200, 450, 3100, 980, 2600], use a loop to print the total of the invoices above 1000, then how many there were.","hint":"Keep two variables: a running total and a counter.","sol":"invoices = [1200, 450, 3100, 980, 2600]\ntotal = 0\ncount = 0\nfor inv in invoices:\n    if inv > 1000:\n        total += inv\n        count += 1\nprint(total)\nprint(count)","out":"6900\n3","img":[]}]},{"id":"functions","stage":"Python basics","title":"Functions and libraries","summary":"Packaging logic you reuse, and importing other people's.","excel":[["LAMBDA / named formula","def name(args): ... return"],["LET variables","variables inside a function"],["Re-using a formula across sheets","calling the function"],["Add-ins (Analysis ToolPak)","import a library"]],"lessons":[{"h":"def and return","text":"`def` creates a function. `return` sends a value back to whoever called it.","code":"def add_vat(amount):\n    return amount * 1.15\n\nprint(add_vat(1000))\nprint(round(add_vat(89.9), 2))","out":"1150.0\n103.39","img":[]},{"h":"Several inputs and defaults","text":"Parameters with `=` have a default, so the caller can leave them out.","code":"def margin(revenue, cost, as_percent=True):\n    m = (revenue - cost) / revenue\n    return round(m * 100, 1) if as_percent else m\n\nprint(margin(5000, 3200))\nprint(margin(5000, 3200, as_percent=False))","out":"36.0\n0.36","img":[]},{"h":"Functions with rules","text":"Put business rules in one function so every report uses the same logic. A `return` ends the function immediately.","code":"def size_band(qty):\n    if qty >= 100:\n        return \"Bulk\"\n    elif qty >= 20:\n        return \"Medium\"\n    return \"Small\"\n\nprint([size_band(q) for q in [5, 35, 150]])","out":"['Small', 'Medium',  clean[\"qty\"].fillna(0)\nprint(clean[\"qty\"].isna().sum())","out":"1\n0","img":[]},{"h":"Calculated columns","text":"Assign to a new column name. The calculation runs on every row at once.","code":"clean[\"revenue\"] = clean[\"qty\"] * clean[\"unit_price\"]\nprint(clean[[\"product\", \"qty\", \"unit_price\", \"revenue\"]].head(4))","out":"    product    qty  unit_price  revenue\n0  A4 Paper   20.0        89.0   1780.0\n1      Pens  150.0         4.5    675.0\n2   Stapler    5.0       145.0    725.0\n3      Pens  200.0         4.5    900.0","img":[]},{"h":"Dates","text":"Dates imported as text can't be grouped by month. Convert with `pd.to_datetime`, then pull parts out with `.dt`.","code":"clean[\"date\"] = pd.to_datetime(clean[\"date\"])\nclean[\"month\"] = clean[\"date\"].dt.month_name()\nclean[\"weekday\"] = clean[\"date\"].dt.day_name()\nprint(clean[[\"date\", \"month\", \"weekday\"]].head(3))","out":"        date    month weekday\n0 2026-01-05  January  Monday\n1 2026-01-12  January  Monday\n2 2026-01-19  January  Monday","img":[]},{"h":"Messy text and numbers stored as text","text":"Every string method from module 3 works on a whole column through `.str`. Here a rand amount with spaces and a comma decimal becomes a real number.","code":"messy = pd.DataFrame({\n    \"client\": [\"  acme traders\", \"ACME TRADERS \", \"Bright Ink\"],\n    \"amount\": [\"R1 250,00\", \"R980,50\", \"R2 100,00\"],\n})\nmessy[\"client\"] = messy[\"client\"].str.strip().str.title()\nmessy[\"amount\"] = (messy[\"amount\"]\n                   .str.replace(\"R\", \"\")\n                   .str.replace(\" \", \"\")\n                   .str.replace(\",\", \".\")\n                   .astype(float))\nprint(messy)\nprint(messy[\"amount\"].sum())\nprint(messy[\"client\"].nunique())","out":"         client  amount\n0  Acme Traders  1250.0\n1  Acme Traders   980.5\n2    Bright Ink  2100.0\n4330.5\n2","img":[]},{"h":"Conditional columns and bands","text":"`np.where` handles two outcomes. `pd.cut` puts numbers into bands, like an approximate-match lookup table.","code":"clean[\"band\"] = np.where(clean[\"qty\"] >= 100, \"Bulk\", \"Standard\")\nprint(clean[[\"product\", \"qty\", \"band\"]].head(4))\n\nclean[\"size\"] = pd.cut(clean[\"qty\"], bins=[-1, 19, 99, 1000], labels=[\"Small\", \"Medium\", \"Bulk\"])\nprint(clean[\"size\"].value_counts())","out":"    product    qty      band\n0  A4 Paper   20.0  Standard\n1      Pens  150.0      Bulk\n2   Stapler    5.0  Standard\n3      Pens  200.0      Bulk\nsize\nMedium    6\nSmall     3\nBulk      3\nName: count, dtype: int64","img":[]},{"h":"Rename, drop, de-duplicate","text":"Tidy column names early so later code is easy to read.","code":"tidy = clean.rename(columns={\"unit_price\": \"price\"}).drop(columns=[\"weekday\"])\nprint(list(tidy.columns))\nprint(len(tidy.drop_duplicates(subset=[\"product\"])))","out":"['order_id', 'date', 'branch', 'product', 'category', 'qty', 'price', 'revenue', 'month', 'band', 'size']\n4","img":[]}],"drills":[{"t":"mcq","q":"What prints?","code":"s = pd.Series([10, None, 30])\nprint(s.fillna(0).sum())","opts":["40","40.0","NaN","Error"],"a":1,"run":true,"why":"The blank makes the column float, so the sum is 40.0."},{"t":"mcq","q":"What prints?","code":"s = pd.Series([10, None, 30])\nprint(s.mean())","opts":["13.33","20.0","NaN","40.0"],"a":1,"run":true,"why":"mean() skips blanks: (10 + 30) / 2. Excel AVERAGE also ignores blank cells."},{"t":"mcq","q":"What prints?","code":"s = pd.Series([\"  dbn\", \"CPT \"])\nprint(s.str.strip().str.upper().tolist())","opts":["['DBN', 'CPT']","['  DBN', 'CPT ']","['Dbn', 'Cpt']","DBN CPT"],"a":0,"run":true,"why":"strip removes spaces, upper capitalises, tolist turns the Series into a list."},{"t":"mcq","q":"What prints?","code":"d = pd.to_datetime(pd.Series([\"2026-03-15\"]))\nprint(d.dt.month[0])","opts":["15","3","March","2026"],"a":1,"run":true,"why":".dt.month gives the month number. Use .dt.month_name() for 'March'."},{"t":"mcq","q":"What prints?","code":"t = pd.DataFrame({\"a\": [1, 1, 2]})\nprint(len(t.drop_duplicates()))","opts":["3","2","1","0"],"a":1,"run":true,"why":"The two identical rows collapse into one."},{"t":"write","q":"Using sales: fill the missing qty with the median qty, add a revenue column, and print total revenue rounded to 2 decimals.","hint":"The median is sales[\"qty\"].median(). Copy first so sales stays unchanged.","sol":"work = sales.copy()\nwork[\"qty\"] = work[\"qty\"].fillna(work[\"qty\"].median())\nwork[\"revenue\"] = work[\"qty\"] * work[\"unit_price\"]\nprint(round(work[\"revenue\"].sum(), 2))","out":"14605.0","img":[]}]},{"id":"pandas-summarise","stage":"pandas","title":"pandas: summarise, pivot, join","data":true,"summary":"groupby, multi-measure summaries, pivot tables, lookups with merge, appending tables.","excel":[["=SUMIFS(rev, branch, x) per branch","df.groupby(\"branch\")[\"revenue\"].sum()"],["COUNTIFS / AVERAGEIFS side by side","groupby().agg(name=(col, func))"],["PivotTable with row and column fields","df.pivot_table(index=, columns=, values=)"],["Grand totals","margins=True"],["XLOOKUP from another table","merge(other, on=\"key\", how=\"left\")"],["Power Query Merge","merge(..., how='inner' / 'left' / 'outer')"],["Power Query Append","pd.concat([df1, df2])"],["=TAKE(SORT(...),3)","sort_values(ascending=False).head(3)"]],"lessons":[{"h":"Prepare once","text":"Each analysis starts from a clean table. This short prep step is reused in the next two modules.","code":"df = sales.fillna({\"qty\": 0})\ndf[\"revenue\"] = df[\"qty\"] * df[\"unit_price\"]\nprint(df[[\"branch\", \"product\", \"revenue\"]].head(3))","out":"         branch   product  revenue\n0     Cape Town  A4 Paper   1780.0\n1  Johannesburg      Pens    675.0\n2        Durban   Stapler    725.0","img":[]},{"h":"groupby: SUMIFS for every group at once","text":"Split by a column, pick the value, apply a function.","code":"print(df.groupby(\"branch\")[\"revenue\"].sum())","out":"branch\nCape Town       4720.0\nDurban          4675.0\nJohannesburg    4330.0\nName: revenue, dtype: float64","img":[]},{"h":"Several measures in one table","text":"`agg` with named outputs builds a clean summary table. The pattern is `new_name=(column, function)`.","code":"summary = df.groupby(\"branch\").agg(\n    orders=(\"order_id\", \"count\"),\n    units=(\"qty\", \"sum\"),\n    revenue=(\"revenue\", \"sum\"),\n    avg_order=(\"revenue\", \"mean\"),\n).round(2)\nprint(summary)","out":"              orders  units  revenue  avg_order\nbranch                                         \nCape Town          4  268.0   4720.0    1180.00\nDurban             4  180.0   4675.0    1168.75\nJohannesburg       4  305.0   4330.0    1082.50","img":[]},{"h":"Top N","text":"Group, sort, then take the head.","code":"top = df.groupby(\"product\")[\"revenue\"].sum().sort_values(ascending=False)\nprint(top.head(3))","out":"product\nA4 Paper     7120.0\nPens         2520.0\nNotebooks    2200.0\nName: revenue, dtype: float64","img":[]},{"h":"pivot_table","text":"The closest thing to an Excel PivotTable. `fill_value=0` replaces empty cells and `margins=True` adds totals.","code":"df[\"month\"] = pd.to_datetime(df[\"date\"]).dt.strftime(\"%Y-%m\")\npt = df.pivot_table(index=\"branch\", columns=\"month\", values=\"revenue\",\n                    aggfunc=\"sum\", fill_value=0, margins=True, margins_name=\"Total\")\nprint(pt)","out":"month         2026-01  2026-02  2026-03  2026-04    Total\nbranch                                                   \nCape Town      1780.0    900.0   2040.0      0.0   4720.0\nDurban          725.0   1320.0   2225.0    405.0   4675.0\nJohannesburg    675.0   3115.0    540.0      0.0   4330.0\nTotal          3180.0   5335.0   4805.0    405.0  13725.0","img":[]},{"h":"merge: lookups between tables","text":"`merge` brings columns from another table by matching a key. `how=\"left\"` keeps every row of the left table, like XLOOKUP down a column. `inner` keeps only matches, `outer` keeps everything.","code":"targets = pd.DataFrame({\"branch\": [\"Cape Town\", \"Johannesburg\", \"Durban\"],\n                        \"target\": [5000, 4000, 5000]})\nbranch_rev = df.groupby(\"branch\", as_index=False)[\"revenue\"].sum()\nresult = branch_rev.merge(targets, on=\"branch\", how=\"left\")\nresult[\"pct_of_target\"] = (result[\"revenue\"] / result[\"target\"] * 100).round(1)\nprint(result)","out":"         branch  revenue  target  pct_of_target\n0     Cape Town   4720.0    5000           94.4\n1        Durban   4675.0    5000           93.5\n2  Johannesburg   4330.0    4000          108.2","img":[]},{"h":"concat: stacking tables","text":"Stack tables with the same columns, like Power Query Append. `ignore_index=True` renumbers the rows.","code":"q1 = df[df[\"month\"] <= \"2026-03\"]\nq2 = df[df[\"month\"] > \"2026-03\"]\nboth = pd.concat([q1, q2], ignore_index=True)\nprint(len(q1), len(q2), len(both))","out":"11 1 12","img":[]}],"drills":[{"t":"mcq","q":"What prints?","code":"t = pd.DataFrame({\"k\": [\"a\", \"b\", \"a\"], \"v\": [1, 2, 3]})\nprint(t.groupby(\"k\")[\"v\"].sum()[\"a\"])","opts":["1","3","4","6"],"a":2,"run":true,"why":"Group a holds 1 and 3."},{"t":"mcq","q":"You merge orders (left) with a price list using how='left'. An order's product isn't in the price list. What happens?","code":"","opts":["The order row is dropped","The order stays and the price is NaN","pandas raises an error","The price list row is added"],"a":1,"why":"A left join keeps every left row. Missing matches become NaN, like #N/A from XLOOKUP."},{"t":"mcq","q":"What prints?","code":"a = pd.DataFrame({\"id\": [1, 2, 3]})\nb = pd.DataFrame({\"id\": [1, 3], \"x\": [10, 30]})\nprint(len(a.merge(b, on=\"id\", how=\"inner\")))","opts":["3","2","1","5"],"a":1,"run":true,"why":"Only ids 1 and 3 exist in both tables."},{"t":"mcq","q":"What prints?","code":"x = pd.DataFrame({\"v\": [1, 2]})\ny = pd.DataFrame({\"v\": [3]})\nprint(len(pd.concat([x, y])))","opts":["2","3","1","6"],"a":1,"run":true,"why":"concat stacks the rows: 2 + 1."},{"t":"mcq","q":"Revenue by branch is in df. Which line gives the branch with the highest revenue?","code":"","opts":["df[\"revenue\"].max()","df.groupby(\"branch\")[\"revenue\"].sum().idxmax()","df.sort_values(\"branch\").head(1)","df[\"branch\"].max()"],"a":1,"why":"Sum per branch first, then idxmax returns the label with the largest total. df['branch'].max() is just the last name alphabetically."},{"t":"write","q":"Build a pivot of revenue with category as rows and branch as columns, with totals. Start with the prep step.","hint":"pivot_table(index=..., columns=..., values=..., aggfunc='sum', fill_value=0, margins=True)","sol":"df = sales.fillna({\"qty\": 0})\ndf[\"revenue\"] = df[\"qty\"] * df[\"unit_price\"]\npt = df.pivot_table(index=\"category\", columns=\"branch\", values=\"revenue\",\n                    aggfunc=\"sum\", fill_value=0, margins=True, margins_name=\"Total\")\nprint(pt)","out":"branch    Cape Town  Durban  Johannesburg    Total\ncategory                                          \nOffice       1160.0   725.0           0.0   1885.0\nPaper        2660.0  3545.0        3115.0   9320.0\nWriting       900.0   405.0        1215.0   2520.0\nTotal        4720.0  4675.0        4330.0  13725.0","img":[]}]},{"id":"charts","stage":"Visualisation","title":"Charts with matplotlib","data":true,"summary":"Bar, line and seaborn charts straight from a DataFrame, and saving them.","excel":[["Insert > Chart","series.plot(kind=...)"],["Clustered column","kind=\"bar\""],["Bar (horizontal)","kind=\"barh\""],["Line","kind=\"line\""],["Chart and axis titles","title=..., plt.xlabel(...), plt.ylabel(...)"],["Save as Picture","plt.savefig(\"chart.png\", dpi=150)"]],"lessons":[{"h":"A bar chart in three lines","text":"Any Series can plot itself. Sorting first makes a ranked chart easier to read.","code":"import matplotlib.pyplot as plt\n\ndf = sales.fillna({\"qty\": 0})\ndf[\"revenue\"] = df[\"qty\"] * df[\"unit_price\"]\nbr \n\nfolder = Path(\"monthly_sales\")\nfolder.mkdir(exist_ok=True)\nmonth = pd.to_datetime(sales[\"date\"]).dt.strftime(\"%Y-%m\")\nfor m, part in sales.groupby(month):\n    part.to_excel(folder / f\"sales_{m}.xlsx\", index=False)\nprint(sorted(p.name for p in folder.glob(\"*.xlsx\")))","out":"['sales_2026-01.xlsx', 'sales_2026-02.xlsx', 'sales_2026-03.xlsx', 'sales_2026-04.xlsx']","img":[]},{"h":"Step 2: read and combine every file","text":"Loop over the folder, read each file, tag it with its file name, and stack them. A new month's file is picked up automatically on the next run.","code":"frames = []\nfor file in sorted(folder.glob(\"*.xlsx\")):\n    part = pd.read_excel(file)\n    part[\"source_file\"] = file.name\n    frames.append(part)\n\ncombined = pd.concat(frames, ignore_index=True)\nprint(combined.shape)\nprint(combined[\"source_file\"].value_counts().sort_index())","out":"(12, 8)\nsource_file\nsales_2026-01.xlsx    3\nsales_2026-02.xlsx    3\nsales_2026-03.xlsx    5\nsales_2026-04.xlsx    1\nName: count, dtype: int64","img":[]},{"h":"Step 3: cleaning as one function","text":"Put every cleaning step in one function, the way Power Query keeps Applied Steps. Each new batch of data gets exactly the same treatment.","code":"def clean_sales(raw):\n    out = raw.copy()\n    out[\"qty\"] = out[\"qty\"].fillna(0)\n    out[\"date\"] = pd.to_datetime(out[\"date\"])\n    out[\"month\"] = out[\"date\"].dt.strftime(\"%Y-%m\")\n    out[\"revenue\"] = out[\"qty\"] * out[\"unit_price\"]\n    return out\n\ndata = clean_sales(combined)\nprint(data[[\"month\", \"branch\", \"revenue\"]].head(3))","out":"     month        branch  revenue\n0  2026-01     Cape Town   1780.0\n1  2026-01  Johannesburg    675.0\n2  2026-01        Durban    725.0","img":[]},{"h":"Step 4: summaries","text":"Build every table the report needs.","code":"by_branch = data.groupby(\"branch\").agg(orders=(\"order_id\", \"count\"),\n                                     revenue=(\"revenue\", \"sum\")).round( const MODS = DATA.modules;
const KEY = "pyDrills.v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { state = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const inl = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");

const KW = new Set("False None True and as assert break class continue def del elif else except finally for from global if import in is lambda not or pass raise return try while with yield".split(" "));
const BI = new Set("print len sum min max round sorted range int float str bool type list dict set tuple enumerate zip abs".split(" "));
function hl(code) {
  const re = /(#[^\n]*)|([rfRF]{0,2}"(?:[^"\\\n]|\\.)*"|[rfRF]{0,2}'(?:[^'\\\n]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    if (m[1]) out += `<span class="tk-c">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="tk-s">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="tk-n">${m[3]}</span>`;
    else if (KW.has(m[4])) out += `<span class="tk-k">${m[4]}</span>`;
    else if (BI.has(m[4])) out += `<span class="tk-f">${m[4]}</span>`;
    else out += m[4];
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}

const dkey = (mi, di) => MODS[mi].id + ":" + di;
function modStats(mi) {
  const n = MODS[mi].drills.length;
  let done = 0, right = 0, mcq = 0;
  MODS[mi].drills.forEach((d, di) => {
    const s = state[dkey(mi, di)];
    if (d.t === "mcq") mcq++;
    if (s) done++;
    if (s && s.ok) right++;
  });
  return { n, done, right, mcq };
}

function codeCell(code, out, imgs, note) {
  let h = `<div class="cell"><div class="cell-code"><div class="cell-tag"><button class="copy" type="button">Copy</button></div><pre>${hl(code)}</pre></div>`;
  if (out) h += `<div class="cell-out"><span class="lbl">Out</span><pre>${esc(out)}</pre></div>`;
  if (imgs && imgs.length) h += `<div class="cell-out"><span class="lbl">Out</span><div class="imgs">${imgs.map(s => `<img src="${s}" alt="Chart produced by the code above">`).join("")}</div></div>`;
  if (note) h += `<div class="cell-note">${note}</div>`;
  return h + "</div>";
}

function renderNav(cur) {
  let html = "", stage = "";
  MODS.forEach((m, i) => {
    if (m.stage !== stage) { if (stage) html += "</div>"; stage = m.stage; html += `<div><h4>${esc(stage)}</h4>`; }
    const s = modStats(i);
    html += `<a href="#${m.id}" class="${s.done === s.n ? "done" : ""}" ${cur === m.id ? 'aria-current="page"' : ""}><span class="n">${String(i + 1).padStart(2, "0")}</span><span>${esc(m.title)}</span><span class="c">${s.done}/${s.n}</span></a>`;
  });
  document.getElementById("nav").innerHTML = html + "</div>";
  const sel = document.getElementById("jump");
  sel.innerHTML = `<option value="overview">Overview</option>` + MODS.map((m, i) => `<option value="${m.id}">${i + 1}. ${esc(m.title)} (${modStats(i).done}/${m.drills.length})</option>`).join("");
  sel.value = cur || "overview";
  let all = 0, done = 0, right = 0, mcq = 0;
  MODS.forEach((m, i) => { const s = modStats(i); all += s.n; done += s.done; right += s.right; });
  document.getElementById("meter-txt").textContent = `${done} of ${all} drills attempted · ${right} correct or completed`;
  document.getElementById("meter-bar").style.width = (all ? done / all * 100 : 0) + "%";
}

function renderOverview() {
  const total = MODS.reduce((a, m) => a + m.drills.length, 0);
  let h = `<header><div class="eyebrow">Self-study and trainee course · ${MODS.length} modules · ${total} drills</div>
  <h1>Python for analysts, from the first variable to an automated report</h1>
  <p class="lede">Each module teaches one idea with real, runnable code and its actual output, shows the Excel formula you already know beside the Python equivalent, then tests you with drills.</p></header>
  <section class="howto">
    <div><b>Read the cells</b><span>Every code block on this page was run; the Out panel is the real result. Copy any block into Colab to try it.</span></div>
    <div><b>Answer the drills</b><span>"What prints?" drills are marked instantly. "Write it" drills have a hint and a model solution with its output.</span></div>
    <div><b>Practise in the notebook</b><span>The companion notebook has every lesson plus blank cells for each exercise. <a href="https://colab.research.google.com/github/nyarimasiya-cyber/excel-drills/blob/main/python/python-analytics-drills.ipynb" target="_blank" rel="noopener">Open it in Colab</a> or <a href="python-analytics-drills.ipynb" download>download the .ipynb</a>.</span></div>
  </section>
  <section><h2>The practice dataset</h2><p style="margin-bottom:14px">From module 9 on, every example uses <code>sales</code>: twelve stationery orders across Cape Town, Johannesburg and Durban. The notebook creates it at the start of module 9, after the basics modules have finished reusing the name.</p>${codeCell(DATA.setup)}</section>
  <section><h2>Modules</h2><div class="grid">`;
  MODS.forEach((m, i) => {
    const s = modStats(i);
    h += `<a class="mcard" href="#${m.id}"><div class="top"><span>${String(i + 1).padStart(2, "0")} · ${esc(m.stage)}</span><span>${s.done}/${s.n}</span></div><h3>${esc(m.title)}</h3><p>${inl(m.summary)}</p><div class="bar"><span style="width:${s.done / s.n * 100}%"></span></div></a>`;
  });
  h += `</div></section>`;
  return h;
}

function drillHTML(mi, di) {
  const d = MODS[mi].drills[di], k = dkey(mi, di), s = state[k];
  let h = `<div class="drill" data-k="${k}"><div class="q"><span class="num">${mi + 1}.${di + 1}</span><div><div class="kind">${d.t === "mcq" ? (d.code ? "Predict the output" : "Choose one") : "Write it"}</div>${d.q === "What prints?" ? "What does this code print?" : inl(d.q)}</div></div>`;
  if (d.t === "mcq") {
    if (d.code) h += codeCell(d.code);
    const long = d.opts.some(o => o.length > 22 || o.includes("\n"));
    h += `<div class="opts ${long ? "long" : ""} ${d.code ? "" : "prose"}">`;
    d.opts.forEach((o, oi) => {
      let cls = "";
      if (s) { if (oi === d.a) cls = "right"; else if (oi === s.pick) cls = "wrong"; }
      h += `<button type="button" class="opt ${cls}" data-o="${oi}" ${s ? "disabled" : ""}><span class="l">${"ABCD"[oi]}</span><pre>${esc(o)}</pre></button>`;
    });
    h += `</div>`;
    if (s) h += `<div class="fb ${s.ok ? "ok" : "no"}"><b>${s.ok ? "Correct." : "Not quite."}</b> ${inl(d.why)}</div>`;
  } else {
    const open = s && s.sol;
    h += `<div class="btns"><button type="button" class="btn" data-act="hint">Show hint</button><button type="button" class="btn" data-act="sol">${open ? "Hide solution" : "Show solution"}</button><button type="button" class="btn ${s && s.ok ? "on" : ""}" data-act="done">${s && s.ok ? "✓ Completed" : "Mark as completed"}</button></div>`;
    h += `<div class="hint" hidden><b>Hint:</b> ${inl(d.hint)}</div>`;
    h += `<div class="sol" ${open ? "" : "hidden"}>${codeCell(d.sol, d.out, d.img)}</div>`;
  }
  return h + `</div>`;
}

function renderModule(mi) {
  const m = MODS[mi], s = modStats(mi);
  let h = `<header><div class="eyebrow">Module ${mi + 1} of ${MODS.length} · ${esc(m.stage)}</div><h1>${esc(m.title)}</h1><p class="lede">${inl(m.summary)}</p></header>`;
  h += `<section><h2>Excel → Python</h2><div class="xmap"><table><thead><tr><th>In Excel</th><th>In Python</th></tr></thead><tbody>${m.excel.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</tbody></table></div></section>`;
  h += `<section class="lessons">`;
  m.lessons.forEach((l, li) => {
    h += `<article class="lesson"><div class="lesson-head"><span class="k">${mi + 1}.${li + 1}</span><h3>${esc(l.h)}</h3></div><p>${inl(l.text)}</p>${codeCell(l.code, l.out, l.img, l.out === null ? "Reference code: not run here because it needs your own files." : "")}</article>`;
  });
  h += `</section>`;
  h += `<section class="drills" id="drills"><div class="drills-head"><h2>Drills</h2><span class="score">${s.done}/${s.n} attempted · ${s.right} correct or completed</span></div>`;
  m.drills.forEach((d, di) => { h += drillHTML(mi, di); });
  h += `<div><button type="button" class="reset" data-reset="${mi}">Reset this module's drills</button></div></section>`;
  const prev = mi > 0 ? MODS[mi - 1] : null, next = mi < MODS.length - 1 ? MODS[mi + 1] : null;
  h += `<nav class="pager">${prev ? `<a href="#${prev.id}"><span>← Previous</span>${esc(prev.title)}</a>` : `<a href="#overview"><span>← Back</span>Overview</a>`}${next ? `<a class="next" href="#${next.id}"><span>Next →</span>${esc(next.title)}</a>` : ""}</nav>`;
  return h;
}

function route(scroll) {
  const id = location.hash.slice(1);
  const mi = MODS.findIndex(m => m.id === id);
  document.getElementById("page").innerHTML = mi >= 0 ? renderModule(mi) : renderOverview();
  renderNav(mi >= 0 ? id : null);
  if (scroll) window.scrollTo(0, 0);
}

function refreshDrill(el) {
  const [id, di] = el.dataset.k.split(":");
  const mi = MODS.findIndex(m => m.id === id);
  const tmp = document.createElement("div");
  tmp.innerHTML = drillHTML(mi, +di);
  el.replaceWith(tmp.firstElementChild);
  const s = modStats(mi);
  const sc = document.querySelector(".score");
  if (sc) sc.textContent = `${s.done}/${s.n} attempted · ${s.right} correct or completed`;
  renderNav(id);
}

document.addEventListener("click", e => {
  const copy = e.target.closest(".copy");
  if (copy) {
    const pre = copy.closest(".cell-code").querySelector("pre");
    const txt = pre.textContent;
    const ok = () => { copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy", 1400); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); copy.textContent = "Selected"; setTimeout(() => copy.textContent = "Copy", 1400); };
    try { navigator.clipboard.writeText(txt).then(ok, fallback); } catch (err) { fallback(); }
    return;
  }
  const opt = e.target.closest(".opt");
  if (opt && !opt.disabled) {
    const el = opt.closest(".drill"), [id, di] = el.dataset.k.split(":");
    const d = MODS.find(m => m.id === id).drills[+di], pick = +opt.dataset.o;
    state[el.dataset.k] = { pick, ok: pick === d.a };
    save(); refreshDrill(el); return;
  }
  const act = e.target.closest("[data-act]");
  if (act) {
    const el = act.closest(".drill"), k = el.dataset.k;
    if (act.dataset.act === "hint") { const hn = el.querySelector(".hint"); hn.hidden = !hn.hidden; act.textContent = hn.hidden ? "Show hint" : "Hide hint"; return; }
    const s = state[k] || {};
    if (act.dataset.act === "sol") s.sol = !s.sol;
    if (act.dataset.act === "done") s.ok = !s.ok;
    if (!s.ok && !s.sol) delete state[k]; else state[k] = s;
    save(); refreshDrill(el); return;
  }
  const rs = e.target.closest("[data-reset]");
  if (rs) {
    const m = MODS[+rs.dataset.reset];
    m.drills.forEach((_, di) => delete state[m.id + ":" + di]);
    save(); route(false); document.getElementById("drills").scrollIntoView(); return;
  }
  const tb = e.target.closest("[data-t]");
  if (tb) setTheme(tb.dataset.t);
});

document.getElementById("jump").addEventListener("change", e => { location.hash = e.target.value; });
window.addEventListener("hashchange", () => route(true));

function setTheme(t) {
  if (t === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem(KEY + ".theme", t); } catch (e) {}
  document.querySelectorAll("[data-t]").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === t));
}
let th = "system";
try { th = localStorage.getItem(KEY + ".theme") || "system"; } catch (e) {}
setTheme(th);
route(false);
</script>
</body>
